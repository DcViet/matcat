<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="384" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Two ways for a building to carry a symbol</text>
  <line x1="24" y1="54" x2="48" y2="54" stroke="#b4472e" stroke-width="2.5"/>
  <text x="56" y="58" font-size="11.5" fill="#5f5b53">red: the part that carries the symbol</text>

  <!-- Con vit -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#a8a498" stroke-width="1.25"/>
  <g fill="#ffffff" stroke="#b4472e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M100 190 L100 120 L134 120 L140 175 Z"/>
    <circle cx="117" cy="108" r="24"/>
    <path d="M80 250 C62 215 80 168 150 162 C220 156 285 172 318 198 L338 180 L330 214 C326 236 312 250 300 250 Z"/>
  </g>
  <polygon points="95,100 58,110 96,118" fill="#b4472e"/>
  <circle cx="110" cy="102" r="2.5" fill="#1c1b19"/>
  <rect x="186" y="214" width="22" height="36" fill="#ffffff" stroke="#1c1b19" stroke-width="1.25"/>
  <rect x="232" y="206" width="20" height="16" fill="#ffffff" stroke="#1c1b19" stroke-width="1.25"/>

  <!-- Nha che -->
  <line x1="400" y1="250" x2="710" y2="250" stroke="#a8a498" stroke-width="1.25"/>
  <line x1="440" y1="250" x2="440" y2="140" stroke="#1c1b19" stroke-width="2"/>
  <rect x="410" y="80" width="130" height="60" fill="#b4472e"/>
  <text x="475" y="116" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">SIGN</text>
  <rect x="470" y="190" width="150" height="60" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <rect x="480" y="197" width="130" height="12" fill="#b4472e"/>
  <rect x="534" y="218" width="22" height="32" fill="#ffffff" stroke="#1c1b19" stroke-width="1.25"/>
  <rect x="490" y="220" width="24" height="16" fill="#ffffff" stroke="#1c1b19" stroke-width="1.25"/>
  <rect x="576" y="220" width="24" height="16" fill="#ffffff" stroke="#1c1b19" stroke-width="1.25"/>
  <text x="552" y="114" font-size="11.5" fill="#5f5b53">big sign</text>
  <text x="632" y="226" font-size="11.5" fill="#5f5b53">little building</text>

  <text x="200" y="280" text-anchor="middle" font-weight="600" fill="#1c1b19">The duck</text>
  <text x="200" y="299" text-anchor="middle" font-size="11.5" fill="#5f5b53">The whole form is the symbol;</text>
  <text x="200" y="315" text-anchor="middle" font-size="11.5" fill="#5f5b53">space, structure, and program sink beneath it</text>
  <text x="560" y="280" text-anchor="middle" font-weight="600" fill="#1c1b19">The decorated shed</text>
  <text x="560" y="299" text-anchor="middle" font-size="11.5" fill="#5f5b53">A plain shelter that serves its program directly;</text>
  <text x="560" y="315" text-anchor="middle" font-size="11.5" fill="#5f5b53">the symbol is applied outside: a sign, a front</text>

  <text x="24" y="350" font-size="11" fill="#5f5b53">The writer's concept diagram, drawn from the definitions in Learning from Las Vegas (pp. 87–90);</text>
  <text x="24" y="366" font-size="11" fill="#5f5b53">not a drawing of any building and not a figure from the book.</text>
</svg>
