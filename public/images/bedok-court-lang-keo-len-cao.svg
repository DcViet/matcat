<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5f5b53"/></marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">Cái hiên là lớp đệm: từ làng kampong lên nhà cao tầng</text>

  <text x="24" y="62" font-size="12.5" font-weight="600" fill="#5f5b53">Nhà kampong, nằm trên đất</text>
  <g stroke="#a8a498" stroke-width="1.25" fill="#ffffff">
    <rect x="24" y="72" width="210" height="70" rx="4"/>
    <rect x="275" y="72" width="210" height="70" rx="4" stroke="#b4472e" fill="#b4472e" fill-opacity="0.08"/>
    <rect x="526" y="72" width="210" height="70" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1c1b19">
    <text x="129" y="102" font-weight="600">Đường làng, sân</text>
    <text x="380" y="102" font-weight="600">Hiên nhà</text>
    <text x="631" y="102" font-weight="600">Phòng trong nhà</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5f5b53">
    <text x="129" y="122">ai đi qua cũng thấy nhau</text>
    <text x="380" y="122">chỗ đệm giữa ngoài và trong</text>
    <text x="631" y="122">riêng tư hơn</text>
  </g>
  <g stroke="#5f5b53" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="238" y1="107" x2="271" y2="107"/>
    <line x1="489" y1="107" x2="522" y2="107"/>
  </g>

  <text x="24" y="194" font-size="12.5" font-weight="600" fill="#5f5b53">Bedok Court, lặp lại ở mỗi tầng</text>
  <g stroke="#a8a498" stroke-width="1.25" fill="#ffffff">
    <rect x="24" y="204" width="210" height="70" rx="4"/>
    <rect x="275" y="204" width="210" height="70" rx="4" stroke="#b4472e" fill="#b4472e" fill-opacity="0.08"/>
    <rect x="526" y="204" width="210" height="70" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1c1b19">
    <text x="129" y="234" font-weight="600">Hành lang chung</text>
    <text x="380" y="234" font-weight="600">Hiên sân trước</text>
    <text x="631" y="234" font-weight="600">Phòng trong căn hộ</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5f5b53">
    <text x="129" y="254">"phố trên không", rộng 1,4 m</text>
    <text x="380" y="254">bán mở, nên sâu từ 2 m</text>
    <text x="631" y="254">riêng tư hơn</text>
  </g>
  <g stroke="#5f5b53" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="238" y1="239" x2="271" y2="239"/>
    <line x1="489" y1="239" x2="522" y2="239"/>
  </g>

  <g text-anchor="middle" font-size="11.5" fill="#b4472e">
    <path d="M275 288H485M275 283V293M485 283V293" stroke="#b4472e" stroke-width="1" fill="none"/>
    <text x="380" y="310">đủ chỗ ngồi, đủ bóng, nhiều cây thì mát hơn</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="#5f5b53">
    <text x="129" y="352">chung</text>
    <text x="380" y="352">nửa chung nửa riêng</text>
    <text x="631" y="352">riêng</text>
  </g>
  <line x1="24" y1="362" x2="736" y2="362" stroke="#a8a498" stroke-width="1.25" marker-end="url(#ar)"/>

  <g font-size="10.5" fill="#5f5b53">
    <text x="24" y="388">Sơ đồ khái niệm, không theo tỉ lệ. Hai số đo (hành lang 1,4 m, hiên từ 2 m) lấy từ khảo sát ở Bedok Court (Bay và cộng sự, 2006).</text>
    <text x="24" y="404">Đây là sơ đồ ý niệm của tác giả bài viết, không phải bản vẽ của công trình.</text>
  </g>
</svg>
