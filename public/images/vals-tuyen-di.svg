<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="'Segoe UI', Arial, sans-serif" font-size="12">
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Đường vào nhà tắm đi xuống dần và sáng dần</text>

  <!-- Sáu chặng, mỗi chặng thấp hơn và sáng hơn chặng trước -->
  <rect x="24" y="64" width="112" height="72" fill="#f3efe7" stroke="#a8a498" stroke-width="1.25"/>
  <text x="80" y="96" text-anchor="middle" font-weight="600" fill="#1c1b19">Khách sạn</text>
  <text x="80" y="113" text-anchor="middle" font-size="11" fill="#5f5b53">điểm xuất phát</text>

  <rect x="144" y="72" width="112" height="72" fill="#35332f"/>
  <text x="200" y="104" text-anchor="middle" font-weight="600" fill="#ffffff">Sảnh như hang</text>
  <text x="200" y="121" text-anchor="middle" font-size="11" fill="#e6e1d6">tối, thấp</text>

  <rect x="264" y="84" width="112" height="72" fill="#55524b"/>
  <text x="320" y="116" text-anchor="middle" font-weight="600" fill="#ffffff">Hành lang</text>
  <text x="320" y="133" text-anchor="middle" font-size="11" fill="#e6e1d6">mờ hơi nước</text>

  <rect x="384" y="100" width="112" height="72" fill="#8a867c"/>
  <text x="440" y="132" text-anchor="middle" font-weight="600" fill="#ffffff">Bậc đá</text>
  <text x="440" y="149" text-anchor="middle" font-size="11" fill="#ffffff">đi xuống</text>

  <rect x="504" y="116" width="112" height="72" fill="#cfc9bb"/>
  <text x="560" y="148" text-anchor="middle" font-weight="600" fill="#1c1b19">Không gian chính</text>
  <text x="560" y="165" text-anchor="middle" font-size="11" fill="#35332f">khối đá rỗng, nước</text>

  <rect x="624" y="116" width="112" height="72" fill="#fbf9f4" stroke="#b4472e" stroke-width="2"/>
  <text x="680" y="148" text-anchor="middle" font-weight="600" fill="#1c1b19">Vách kính</text>
  <text x="680" y="165" text-anchor="middle" font-size="11" fill="#5f5b53">nhìn ra thung lũng</text>

  <!-- Thanh chú giải ánh sáng -->
  <text x="24" y="222" font-size="11.5" fill="#5f5b53">tối</text>
  <line x1="52" y1="218" x2="700" y2="218" stroke="#b4472e" stroke-width="1.5"/>
  <path d="M700 218l-9 -5v10z" fill="#b4472e"/>
  <text x="736" y="222" text-anchor="end" font-size="11.5" fill="#5f5b53">sáng</text>

  <text x="24" y="252" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm theo mô tả trong tài liệu thứ cấp, không theo tỷ lệ và không phải mặt cắt thật của công trình.</text>
</svg>
