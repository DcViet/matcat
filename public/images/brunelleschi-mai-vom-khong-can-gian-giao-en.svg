  <!-- Chú thích bên phải -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="470" y="539">about 42 m: the church body (simplified)</text>
    <text x="470" y="401.5">13 m: the octagonal drum</text>
    <text x="470" y="275.1">about 37 m: the two shells of the dome</text>
    <text x="470" y="128.7">about 21 m: the lantern on top</text>
    <text x="470" y="54.7" fill="#1c1b19">about 114.5 m in all, counting the ball and cross</text>
    <text x="470" y="323">wood and stone chains bind the base of the dome,</text>
    <text x="470" y="337">so it cannot push the walls outward</text>
    <path d="M437 360 L464 320" stroke="#a8a498" stroke-width="1" fill="none"/>

    <text x="300" y="397" text-anchor="middle">inner span 45.5 m</text>
    <text x="300" y="422" text-anchor="middle">(measured between opposite corners)</text>
    <text x="300" y="678" text-anchor="middle">outer width 54.8 m</text>
    <text x="420.3" y="688">Pantheon: 43.3 m (earlier post)</text>
    <text x="255" y="592.5" text-anchor="middle" font-size="10.5">person</text>
    <text x="255" y="606" text-anchor="middle" font-size="10.5">1.7 m tall</text>
    <text x="49" y="654" text-anchor="middle">10 m</text>
  </g>

  <!-- Chú thích bên trái, chỉ vào hai lớp vỏ và khoảng rỗng -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="24" y="150">outer shell: thin,</text><text x="24" y="164">about 0.6 m at the base</text>
    <text x="24" y="206">gap between the shells:</text><text x="24" y="220">a stairway climbs through it</text>
    <text x="24" y="262">inner shell: much thicker,</text><text x="24" y="276">it carries the main load</text>
  </g>
  <g stroke="#a8a498" stroke-width="1" fill="none">
    <path d="M190 158 L229 214.1"/>
    <path d="M190 214 L222 234.3"/>
    <path d="M190 270 L219 257.8"/>
  </g>

  <g font-size="10.5" fill="#5f5b53">
    <text x="24" y="714">Simplified section through two opposite corners of the octagon, drawn to scale (1 m = 5 px); the 10 m bar is at lower left.</text>
    <text x="24" y="728">The curves follow the pointed "quinto acuto" (inner) and "quarto acuto" (outer) profiles from the two diameters above.</text>
    <text x="24" y="742">Shell thicknesses are approximate; ribs, chains and stairs are left out. This is the author's own figure, not a drawing of the building.</text>
  </g>
</svg>
