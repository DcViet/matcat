<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="350" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Two ways to place trees: let one stand alone, or group them</text>

  <rect x="24" y="52" width="338" height="244" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="398" y="52" width="338" height="244" fill="none" stroke="#a8a498" stroke-width="1.25"/>

  <text x="40" y="76" font-weight="600" fill="#1c1b19">A single tree on its own</text>
  <text x="414" y="76" font-weight="600" fill="#1c1b19">A grove</text>

  <!-- Mặt bằng: một cây -->
  <rect x="40" y="88" width="306" height="96" fill="#f4f2ec"/>
  <circle cx="193" cy="130" r="34" fill="#b4472e" fill-opacity="0.85"/>
  <circle cx="193" cy="130" r="3" fill="#1c1b19"/>
  <text x="193" y="181" text-anchor="middle" font-size="11" fill="#5f5b53">seen from above</text>

  <!-- Mặt bằng: khóm cây -->
  <rect x="414" y="88" width="306" height="96" fill="#f4f2ec"/>
  <circle cx="540" cy="128" r="26" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="584" cy="122" r="32" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="548" cy="152" r="17" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="618" cy="140" r="21" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="578" cy="153" r="12" fill="#5f5b53" fill-opacity="0.65"/>
  <text x="567" y="181" text-anchor="middle" font-size="11" fill="#5f5b53">many crowns, one mass</text>

  <text x="40" y="212" fill="#1c1b19">· set in an open space as its focus</text>
  <text x="40" y="236" fill="#1c1b19">· against a contrasting sky, wall or shade</text>
  <text x="40" y="260" fill="#1c1b19">· needs a shape and colour of its own</text>
  <text x="40" y="284" fill="#1c1b19">· near a path: leaves, flowers must reward</text>
  <text x="414" y="212" fill="#1c1b19">· bridge from open space to dense</text>
  <text x="414" y="236" fill="#1c1b19">· ease the shift of forms beside a building</text>
  <text x="414" y="260" fill="#1c1b19">· by water: weeping trees, a contrast</text>
  <text x="414" y="284" fill="#1c1b19">· street end: close the view, back a statue</text>

  <text x="24" y="322" font-size="11.5" fill="#5f5b53">Conceptual diagram, not to scale. Ideas follow Han Tat Ngan (1999); the drawing is mine.</text>
</svg>
