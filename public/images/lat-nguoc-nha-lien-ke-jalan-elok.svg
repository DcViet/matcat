<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">Lật ngược mặt bằng nhà liền kề: hai cách xếp</text>

  <!-- Hàng A: cách xếp quen -->
  <text x="60" y="60" font-size="13" font-weight="600" fill="#1c1b19">Cách xếp quen của nhà liền kề rộng khoảng 6 m (từ phố vào, trái sang phải)</text>
  <g stroke="#1c1b19" stroke-width="1.5" fill="#f1efe9">
    <rect x="60" y="70" width="160" height="108"/>
    <rect x="220" y="70" width="160" height="108"/>
    <rect x="380" y="70" width="160" height="108"/>
    <rect x="540" y="70" width="160" height="108"/>
  </g>
  <g font-size="12" fill="#1c1b19" text-anchor="middle">
    <text x="140" y="128">phòng khách</text>
    <text x="300" y="128">thang</text>
    <text x="460" y="128">ăn</text>
    <text x="620" y="122">bếp,</text>
    <text x="620" y="138">người giúp việc</text>
  </g>
  <text x="52" y="128" font-size="10.5" text-anchor="end" fill="#5f5b53">6 m</text>

  <!-- Hàng B: Jalan Elok -->
  <text x="60" y="206" font-size="13" font-weight="600" fill="#1c1b19">Jalan Elok: vùng giữa 4 m, hai khe sáng và gió 1 m</text>
  <!-- khe trên -->
  <rect x="60" y="216" width="640" height="18" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- vùng giữa -->
  <rect x="60" y="234" width="640" height="72" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/>
  <!-- khe dưới -->
  <rect x="60" y="306" width="640" height="18" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="345" y1="234" x2="345" y2="306" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 3"/>
  <g font-size="10.5" fill="#b4472e" text-anchor="middle">
    <text x="380" y="229">khe sáng và gió rộng 1 m</text>
    <text x="380" y="319">khe sáng và gió rộng 1 m</text>
  </g>
  <g font-size="12" fill="#1c1b19" text-anchor="middle">
    <text x="202" y="266">bếp mở ngay lối vào,</text>
    <text x="202" y="282">lưới dây thép trượt</text>
    <text x="522" y="266">phòng khách kẹp giữa</text>
    <text x="522" y="282">hai tường cây</text>
  </g>
  <g font-size="10.5" fill="#5f5b53" text-anchor="end">
    <text x="52" y="229">1 m</text>
    <text x="52" y="274">4 m</text>
    <text x="52" y="319">1 m</text>
  </g>

  <!-- Ghi chú -->
  <rect x="60" y="340" width="10" height="10" fill="#b4472e"/>
  <text x="78" y="349" font-size="11.5" fill="#5f5b53">Giếng trời thông bốn tầng, giàn mái trượt phủ dây leo; thang hở chạy dọc tường chung.</text>

  <text x="24" y="386" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, không đúng tỉ lệ, không phải bản vẽ của công trình.</text>
</svg>
