<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">Turning a terrace house plan inside out: two layouts</text>

  <text x="60" y="60" font-size="13" font-weight="600" fill="#1c1b19">The usual order in a terrace house about 6 m wide (street to back, left to right)</text>
  <g stroke="#1c1b19" stroke-width="1.5" fill="#f1efe9">
    <rect x="60" y="70" width="160" height="108"/>
    <rect x="220" y="70" width="160" height="108"/>
    <rect x="380" y="70" width="160" height="108"/>
    <rect x="540" y="70" width="160" height="108"/>
  </g>
  <g font-size="12" fill="#1c1b19" text-anchor="middle">
    <text x="140" y="128">living room</text>
    <text x="300" y="128">stair</text>
    <text x="460" y="128">dining</text>
    <text x="620" y="122">kitchen,</text>
    <text x="620" y="138">helper's room</text>
  </g>
  <text x="52" y="128" font-size="10.5" text-anchor="end" fill="#5f5b53">6 m</text>

  <text x="60" y="206" font-size="13" font-weight="600" fill="#1c1b19">Jalan Elok: a 4 m middle zone and two 1 m slots for light and air</text>
  <rect x="60" y="216" width="640" height="18" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="60" y="234" width="640" height="72" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/>
  <rect x="60" y="306" width="640" height="18" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="345" y1="234" x2="345" y2="306" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 3"/>
  <g font-size="10.5" fill="#b4472e" text-anchor="middle">
    <text x="380" y="229">1 m slot for light and air</text>
    <text x="380" y="319">1 m slot for light and air</text>
  </g>
  <g font-size="12" fill="#1c1b19" text-anchor="middle">
    <text x="202" y="266">open kitchen at the entrance,</text>
    <text x="202" y="282">sliding steel-wire screen</text>
    <text x="522" y="266">living room between</text>
    <text x="522" y="282">two green walls</text>
  </g>
  <g font-size="10.5" fill="#5f5b53" text-anchor="end">
    <text x="52" y="229">1 m</text>
    <text x="52" y="274">4 m</text>
    <text x="52" y="319">1 m</text>
  </g>

  <rect x="60" y="340" width="10" height="10" fill="#b4472e"/>
  <text x="78" y="349" font-size="11.5" fill="#5f5b53">Skylight through four floors, sliding roof trellis with climbers; open stair along the party wall.</text>

  <text x="24" y="386" font-size="11.5" fill="#5f5b53">Conceptual diagram by the author, not to scale and not a drawing of the building.</text>
</svg>
