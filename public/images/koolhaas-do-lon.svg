<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="390" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Nhà cỡ thường là một mảnh của phố. Nhà rất lớn thì đứng riêng.</text>

  <!-- Tên hai hình -->
  <text x="187" y="68" text-anchor="middle" font-weight="600" fill="#1c1b19">Nhà cỡ thường</text>
  <text x="570" y="68" text-anchor="middle" font-weight="600" fill="#1c1b19">Nhà rất lớn (Bigness)</text>

  <!-- Mặt phố -->
  <line x1="24" y1="250" x2="736" y2="250" stroke="#a8a498" stroke-width="1.25"/>
  <text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#5f5b53">vỉa hè và phố</text>

  <!-- Trái: năm căn nhà phố -->
  <g fill="#ffffff" stroke="#1c1b19" stroke-width="1.5">
    <rect x="40" y="170" width="54" height="80"/>
    <rect x="100" y="150" width="54" height="100"/>
    <rect x="160" y="180" width="54" height="70"/>
    <rect x="220" y="155" width="54" height="95"/>
    <rect x="280" y="165" width="54" height="85"/>
  </g>
  <!-- Cửa sổ -->
  <g fill="none" stroke="#a8a498" stroke-width="1.25">
    <rect x="52" y="182" width="30" height="16"/>
    <rect x="112" y="162" width="30" height="16"/>
    <rect x="112" y="190" width="30" height="16"/>
    <rect x="172" y="192" width="30" height="16"/>
    <rect x="232" y="167" width="30" height="16"/>
    <rect x="232" y="195" width="30" height="16"/>
    <rect x="292" y="177" width="30" height="16"/>
  </g>
  <!-- Cửa ra vỉa hè -->
  <g fill="#b4472e">
    <rect x="60" y="226" width="14" height="24"/>
    <rect x="120" y="226" width="14" height="24"/>
    <rect x="180" y="226" width="14" height="24"/>
    <rect x="240" y="226" width="14" height="24"/>
    <rect x="300" y="226" width="14" height="24"/>
  </g>

  <!-- Phải: một khối lớn -->
  <rect x="420" y="90" width="300" height="160" fill="#ffffff" stroke="#1c1b19" stroke-width="2"/>
  <g fill="none" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 4">
    <rect x="436" y="104" width="80" height="54"/>
    <rect x="530" y="104" width="80" height="54"/>
    <rect x="624" y="104" width="80" height="54"/>
    <rect x="436" y="170" width="80" height="54"/>
    <rect x="624" y="170" width="80" height="54"/>
  </g>
  <g font-size="20" fill="#a8a498" text-anchor="middle">
    <text x="476" y="138">?</text>
    <text x="570" y="138">?</text>
    <text x="664" y="138">?</text>
    <text x="476" y="204">?</text>
    <text x="664" y="204">?</text>
  </g>
  <rect x="558" y="220" width="24" height="30" fill="#b4472e"/>

  <!-- Chú thích dưới hai hình -->
  <text x="187" y="298" text-anchor="middle" font-size="12" fill="#1c1b19">Nhà nào cũng có cửa mở ra vỉa hè</text>
  <text x="187" y="316" text-anchor="middle" font-size="12" fill="#5f5b53">Nhìn mặt tiền, đoán được bên trong</text>
  <text x="570" y="298" text-anchor="middle" font-size="12" fill="#1c1b19">Cả một ô đất, chỉ vài lối vào</text>
  <text x="570" y="316" text-anchor="middle" font-size="12" fill="#5f5b53">Mặt tiền thôi kể chuyện bên trong</text>

  <text x="24" y="356" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, theo ý Bigness của Koolhaas đọc qua một bộ slide sinh viên.</text>
  <text x="24" y="372" font-size="11.5" fill="#5f5b53">Không phải bản vẽ của một công trình nào. Ô màu đỏ là cửa ra phố.</text>
</svg>
