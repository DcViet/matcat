<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 296" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="296" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Mặt nào sơn đậm thì phòng đổi cảm nhận thế nào</text>

  <!-- Bốn căn phòng nhìn thẳng vào tường cuối. Mặt đậm tô #5f5b53. -->
  <g stroke="#1c1b19" stroke-width="1.25" stroke-linejoin="round">
    <!-- 1. Trần đậm -->
    <polygon points="24,66 192,66 144,96 72,96" fill="#5f5b53"/>
    <polygon points="24,66 72,96 72,156 24,186" fill="#f4f2ec"/>
    <polygon points="192,66 144,96 144,156 192,186" fill="#f4f2ec"/>
    <polygon points="24,186 192,186 144,156 72,156" fill="#f4f2ec"/>
    <rect x="72" y="96" width="72" height="60" fill="#f4f2ec"/>

    <!-- 2. Tường cuối đậm -->
    <polygon points="208,66 376,66 328,96 256,96" fill="#f4f2ec"/>
    <polygon points="208,66 256,96 256,156 208,186" fill="#f4f2ec"/>
    <polygon points="376,66 328,96 328,156 376,186" fill="#f4f2ec"/>
    <polygon points="208,186 376,186 328,156 256,156" fill="#f4f2ec"/>
    <rect x="256" y="96" width="72" height="60" fill="#5f5b53"/>

    <!-- 3. Hai tường bên đậm -->
    <polygon points="392,66 560,66 512,96 440,96" fill="#f4f2ec"/>
    <polygon points="392,66 440,96 440,156 392,186" fill="#5f5b53"/>
    <polygon points="560,66 512,96 512,156 560,186" fill="#5f5b53"/>
    <polygon points="392,186 560,186 512,156 440,156" fill="#f4f2ec"/>
    <rect x="440" y="96" width="72" height="60" fill="#f4f2ec"/>

    <!-- 4. Sàn đậm -->
    <polygon points="576,66 744,66 696,96 624,96" fill="#f4f2ec"/>
    <polygon points="576,66 624,96 624,156 576,186" fill="#f4f2ec"/>
    <polygon points="744,66 696,96 696,156 744,186" fill="#f4f2ec"/>
    <polygon points="576,186 744,186 696,156 624,156" fill="#5f5b53"/>
    <rect x="624" y="96" width="72" height="60" fill="#f4f2ec"/>
  </g>

  <g text-anchor="middle">
    <text x="108" y="212" font-weight="600" fill="#1c1b19">Trần đậm</text>
    <text x="108" y="231" fill="#b4472e">thấp và chật hơn</text>
    <text x="292" y="212" font-weight="600" fill="#1c1b19">Tường cuối đậm</text>
    <text x="292" y="231" fill="#b4472e">ngắn lại</text>
    <text x="476" y="212" font-weight="600" fill="#1c1b19">Hai tường bên đậm</text>
    <text x="476" y="231" fill="#b4472e">cao và sâu hơn</text>
    <text x="660" y="212" font-weight="600" fill="#1c1b19">Sàn đậm</text>
    <text x="660" y="231" fill="#b4472e">cảm giác vững</text>
  </g>

  <text x="24" y="264" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết theo Nutsch (2014), không phải bản vẽ một căn phòng cụ thể.</text>
  <text x="24" y="281" font-size="11.5" fill="#5f5b53">Phần xám đậm là mặt sơn đậm. Kết quả thật còn tùy ánh sáng và văn hóa, hãy thử ngay trong phòng của bạn.</text>
</svg>
