<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Một cái hộp bê tông, một bức tường chéo, một khe sáng</text>

  <!-- Mặt bằng ý niệm -->
  <text x="40" y="74" font-weight="600" fill="#1c1b19">Mặt bằng (ý niệm)</text>
  <rect x="50" y="130" width="260" height="110" fill="none" stroke="#1c1b19" stroke-width="8"/>
  <!-- Tham chiếu vuông góc và bức tường chéo 15 độ -->
  <line x1="180" y1="104" x2="180" y2="266" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 4"/>
  <line x1="160.6" y1="107.6" x2="199.4" y2="252.4" stroke="#b4472e" stroke-width="7"/>
  <path d="M180 124A20 20 0 0 0 176.7 124" fill="none" stroke="#b4472e" stroke-width="1.25"/>
  <text x="150" y="106" text-anchor="end" font-size="12" font-weight="600" fill="#b4472e">15°</text>
  <text x="214" y="98" font-size="11.5" fill="#5f5b53">tường độc lập</text>
  <text x="214" y="113" font-size="11.5" fill="#5f5b53">cắt chéo</text>
  <text x="180" y="284" text-anchor="middle" font-size="11.5" fill="#5f5b53">khối chữ nhật bằng bê tông</text>

  <!-- Mặt tường có khe chữ thập -->
  <text x="470" y="74" font-weight="600" fill="#1c1b19">Mặt tường có khe chữ thập (nhìn thẳng)</text>
  <rect x="470" y="94" width="200" height="190" fill="#1c1b19"/>
  <!-- Lỗ bu-lông -->
  <g fill="#5f5b53">
    <circle cx="500" cy="114" r="2"/><circle cx="540" cy="114" r="2"/><circle cx="600" cy="114" r="2"/><circle cx="640" cy="114" r="2"/>
    <circle cx="500" cy="174" r="2"/><circle cx="540" cy="174" r="2"/><circle cx="600" cy="174" r="2"/><circle cx="640" cy="174" r="2"/>
    <circle cx="500" cy="234" r="2"/><circle cx="540" cy="234" r="2"/><circle cx="600" cy="234" r="2"/><circle cx="640" cy="234" r="2"/>
    <circle cx="500" cy="270" r="2"/><circle cx="540" cy="270" r="2"/><circle cx="600" cy="270" r="2"/><circle cx="640" cy="270" r="2"/>
  </g>
  <!-- Khe sáng: dọc từ sàn đến trần, ngang ở phần trên -->
  <g fill="#fffaf0" stroke="#b4472e" stroke-width="1.25" stroke-opacity="0.55">
    <rect x="564" y="94" width="12" height="190"/>
    <rect x="514" y="140" width="112" height="12"/>
  </g>
  <text x="570" y="302" text-anchor="middle" font-size="11.5" fill="#5f5b53">khe rạch từ sàn đến trần</text>
  <text x="570" y="318" text-anchor="middle" font-size="11.5" fill="#5f5b53">chấm nhỏ là lỗ bu-lông ván khuôn</text>

  <text x="24" y="346" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của tác giả bài viết từ mô tả trong sách; góc, vị trí, tỉ lệ chỉ để minh họa, không phải bản vẽ của công trình.</text>
</svg>
