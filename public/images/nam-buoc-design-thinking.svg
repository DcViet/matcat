<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="mui-ten" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a8a498"/>
    </marker>
  </defs>
  <rect width="760" height="256" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Bước Định nghĩa đặt đề bài cho ba bước sau</text>

  <g stroke="#a8a498" stroke-width="1.25">
    <line x1="144" y1="96" x2="166" y2="96" marker-end="url(#mui-ten)"/>
    <line x1="286" y1="96" x2="308" y2="96" marker-end="url(#mui-ten)"/>
    <line x1="428" y1="96" x2="450" y2="96" marker-end="url(#mui-ten)"/>
    <line x1="570" y1="96" x2="592" y2="96" marker-end="url(#mui-ten)"/>
  </g>
  <line x1="226" y1="132" x2="226" y2="176" stroke="#b4472e" stroke-width="1.25"/>

  <rect x="24" y="60" width="120" height="72" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="84" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">1. Thấu cảm</text>
  <text x="84" y="100" text-anchor="middle" font-size="11.5" fill="#5f5b53">Empathize</text>
  <text x="84" y="116" text-anchor="middle" font-size="11.5" fill="#5f5b53">quan sát, hỏi</text>

  <rect x="166" y="60" width="120" height="72" rx="8" fill="#b4472e" fill-opacity="0.12" stroke="#b4472e" stroke-width="2"/>
  <text x="226" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">2. Định nghĩa</text>
  <text x="226" y="100" text-anchor="middle" font-size="11.5" fill="#5f5b53">Define</text>
  <text x="226" y="116" text-anchor="middle" font-size="11.5" fill="#5f5b53">gọi tên nhu cầu</text>

  <rect x="308" y="60" width="120" height="72" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="368" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">3. Lên ý tưởng</text>
  <text x="368" y="100" text-anchor="middle" font-size="11.5" fill="#5f5b53">Ideate</text>
  <text x="368" y="116" text-anchor="middle" font-size="11.5" fill="#5f5b53">nghĩ lời giải</text>

  <rect x="450" y="60" width="120" height="72" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="510" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">4. Làm mẫu thử</text>
  <text x="510" y="100" text-anchor="middle" font-size="11.5" fill="#5f5b53">Prototype</text>
  <text x="510" y="116" text-anchor="middle" font-size="11.5" fill="#5f5b53">dựng nhanh</text>

  <rect x="592" y="60" width="120" height="72" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="652" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">5. Kiểm tra</text>
  <text x="652" y="100" text-anchor="middle" font-size="11.5" fill="#5f5b53">Test</text>
  <text x="652" y="116" text-anchor="middle" font-size="11.5" fill="#5f5b53">thử với người dùng</text>

  <rect x="166" y="176" width="546" height="56" rx="8" fill="#f3efe7" stroke="#b4472e" stroke-width="1.25"/>
  <text x="182" y="200" fill="#1c1b19">Ở đây "cần cái thang" được viết lại thành "cần với tới".</text>
  <text x="182" y="218" font-size="11.5" fill="#5f5b53">Gọi sai tên nhu cầu thì ba bước sau giải rất khéo một bài toán không ai cần.</text>
</svg>
