<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Sơ đồ khái niệm mặt cắt: hành lang công cộng, hiên bán mở có chậu cây, rồi đến phòng">
  <rect width="760" height="420" fill="#ffffff"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <!-- hành lang -->
    <rect x="40" y="150" width="180" height="190" fill="none" stroke="#a8a498" stroke-width="2"/>
    <text x="130" y="128" text-anchor="middle" font-size="15" fill="#1c1b19">Hành lang công cộng</text>
    <!-- hiên bán mở -->
    <rect x="220" y="150" width="200" height="190" fill="#f3f0e8" stroke="#1c1b19" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="320" y="128" text-anchor="middle" font-size="15" fill="#1c1b19">Hiên bán mở</text>
    <!-- chậu cây -->
    <g fill="#7d8a5c">
      <circle cx="252" cy="262" r="26"/>
      <circle cx="320" cy="256" r="30"/>
      <circle cx="388" cy="262" r="26"/>
    </g>
    <g fill="#8c7a5b">
      <rect x="238" y="296" width="28" height="30" rx="4"/>
      <rect x="306" y="296" width="28" height="30" rx="4"/>
      <rect x="374" y="296" width="28" height="30" rx="4"/>
    </g>
    <!-- phòng -->
    <rect x="420" y="150" width="300" height="190" fill="none" stroke="#a8a498" stroke-width="2"/>
    <text x="570" y="128" text-anchor="middle" font-size="15" fill="#1c1b19">Phòng</text>
    <!-- cửa -->
    <line x1="420" y1="150" x2="420" y2="200" stroke="#1c1b19" stroke-width="3"/>
    <line x1="420" y1="230" x2="420" y2="340" stroke="#1c1b19" stroke-width="3"/>
    <!-- nắng -->
    <line x1="200" y1="30" x2="236" y2="146" stroke="#b4472e" stroke-width="2"/>
    <polygon points="236,150 229,138 243,138" fill="#b4472e"/>
    <text x="192" y="40" text-anchor="end" font-size="14" fill="#b4472e">Nắng</text>
    <!-- kích thước -->
    <line x1="220" y1="372" x2="420" y2="372" stroke="#5f5b53" stroke-width="1.5"/>
    <line x1="220" y1="364" x2="220" y2="380" stroke="#5f5b53" stroke-width="1.5"/>
    <line x1="420" y1="364" x2="420" y2="380" stroke="#5f5b53" stroke-width="1.5"/>
    <text x="320" y="394" text-anchor="middle" font-size="14" fill="#5f5b53">Hiên sâu khoảng 2 m (ngưỡng theo sách)</text>
    <text x="20" y="410" font-size="12" fill="#5f5b53">Sơ đồ khái niệm, không theo tỉ lệ. Hình của người viết, không phải bản vẽ công trình.</text>
  </g>
</svg>
