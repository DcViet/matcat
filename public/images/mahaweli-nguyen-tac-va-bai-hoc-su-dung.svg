<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Mahaweli: điều ghi trên giấy và điều xảy ra khi có người ở</text>
  <text x="24" y="66" font-size="12" font-weight="600" fill="#5f5b53">Ý của người thiết kế</text>
  <text x="436" y="66" font-size="12" font-weight="600" fill="#b4472e">Khi có người ở</text>
  <rect x="24" y="76" width="312" height="56" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="38" y="99" fill="#1c1b19">Ô gió bê tông ở ngưỡng cửa,</text>
  <text x="38" y="118" fill="#5f5b53">gió vào cả khi cửa đóng</text>
  <line x1="348" y1="104" x2="418" y2="104" stroke="#a8a498" stroke-width="1.25"/>
  <path d="M410 99L418 104L410 109" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="424" y="76" width="312" height="56" fill="#ffffff" stroke="#b4472e" stroke-width="1.25"/>
  <text x="438" y="99" fill="#1c1b19">Bít bằng ván ép: mưa tạt,</text>
  <text x="438" y="118" fill="#5f5b53">rò hơi khi chạy điều hòa</text>
  <rect x="24" y="144" width="312" height="56" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="38" y="167" fill="#1c1b19">Mặt bằng mở, gió đi xuyên qua</text>
  <text x="38" y="186" fill="#5f5b53">lỗ cao ở vách sảnh thang</text>
  <line x1="348" y1="172" x2="418" y2="172" stroke="#a8a498" stroke-width="1.25"/>
  <path d="M410 167L418 172L410 177" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="424" y="144" width="312" height="56" fill="#ffffff" stroke="#b4472e" stroke-width="1.25"/>
  <text x="438" y="167" fill="#1c1b19">Chia vách cao thành mê cung,</text>
  <text x="438" y="186" fill="#5f5b53">chặn cả sáng lẫn gió</text>
  <rect x="24" y="212" width="312" height="56" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="38" y="235" fill="#1c1b19">Cửa sổ mở đón gió mùa</text>
  <text x="38" y="254" fill="#5f5b53">từ tầng thấp đến tầng cao</text>
  <line x1="348" y1="240" x2="418" y2="240" stroke="#a8a498" stroke-width="1.25"/>
  <path d="M410 235L418 240L410 245" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="424" y="212" width="312" height="56" fill="#ffffff" stroke="#b4472e" stroke-width="1.25"/>
  <text x="438" y="235" fill="#1c1b19">Tầng thấp đóng cửa vì bụi, ồn;</text>
  <text x="438" y="254" fill="#5f5b53">tầng cao thì giấy bay</text>
  <rect x="24" y="280" width="312" height="56" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="38" y="303" fill="#1c1b19">Mái đua sâu, gờ rủ cắt nắng,</text>
  <text x="38" y="322" fill="#5f5b53">cửa sổ nối cột-cột lấy sáng</text>
  <line x1="348" y1="308" x2="418" y2="308" stroke="#a8a498" stroke-width="1.25"/>
  <path d="M410 303L418 308L410 313" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="424" y="280" width="312" height="56" fill="#ffffff" stroke="#b4472e" stroke-width="1.25"/>
  <text x="438" y="303" fill="#1c1b19">Rèm vải dày, điều hòa cửa sổ;</text>
  <text x="438" y="322" fill="#5f5b53">chói vẫn còn</text>
  <rect x="24" y="352" width="712" height="36" fill="#ffffff" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="38" y="375" font-size="12" fill="#1c1b19">Cách sửa đề xuất: tấm trượt điều gió, quạt trần, mành đục lỗ, che nắng ngoài, vách thấp.</text>
  <text x="24" y="418" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, tóm từ mô tả của Tan và Robson; không phải bản vẽ của công trình.</text>
</svg>
