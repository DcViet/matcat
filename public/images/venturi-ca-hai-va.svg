<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Cùng một cái bếp, hai cách nghĩ</text>

  <text x="24" y="72" font-weight="600" fill="#1c1b19">Hoặc… hoặc: mỗi chỗ một việc</text>
  <rect x="40" y="96" width="140" height="92" rx="4" fill="none" stroke="#a8a498" stroke-width="1.5"/>
  <text x="110" y="122" text-anchor="middle" font-weight="600" fill="#1c1b19">Bếp để nấu</text>
  <text x="110" y="146" text-anchor="middle" font-size="11.5" fill="#5f5b53">đứng, nóng, ồn</text>
  <text x="110" y="166" text-anchor="middle" font-size="11.5" fill="#5f5b53">chỉ làm một việc</text>
  <text x="206" y="146" text-anchor="middle" font-size="12" fill="#5f5b53">hoặc</text>
  <rect x="232" y="96" width="140" height="92" rx="4" fill="none" stroke="#a8a498" stroke-width="1.5"/>
  <text x="302" y="122" text-anchor="middle" font-weight="600" fill="#1c1b19">Bàn để ăn</text>
  <text x="302" y="146" text-anchor="middle" font-size="11.5" fill="#5f5b53">ngồi, yên, sạch</text>
  <text x="302" y="166" text-anchor="middle" font-size="11.5" fill="#5f5b53">chỉ làm một việc</text>
  <text x="206" y="228" text-anchor="middle" font-size="12" fill="#5f5b53">gọn, rõ, nhưng phải đi qua đi lại</text>

  <line x1="384" y1="60" x2="384" y2="250" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="404" y="72" font-weight="600" fill="#b4472e">Cả hai và: một chỗ làm hai việc</text>
  <rect x="404" y="96" width="332" height="92" rx="4" fill="none" stroke="#b4472e" stroke-width="2"/>
  <text x="570" y="122" text-anchor="middle" font-weight="600" fill="#1c1b19">Quầy bếp có ghế</text>
  <text x="570" y="146" text-anchor="middle" font-size="11.5" fill="#5f5b53">Phía trong: người nấu đứng thái rau</text>
  <text x="570" y="166" text-anchor="middle" font-size="11.5" fill="#5f5b53">Phía ngoài: người ăn ngồi, cùng một mặt đá</text>
  <text x="570" y="228" text-anchor="middle" font-size="12" fill="#5f5b53">hơi chen chúc, tuy vậy gần nhau và đỡ tốn chỗ</text>

  <text x="24" y="296" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, ví dụ tự nghĩ ra để minh họa ý "both-and",</text>
  <text x="24" y="312" font-size="11.5" fill="#5f5b53">không phải bản vẽ của công trình nào và không phải hình trong sách của Venturi.</text>
</svg>
