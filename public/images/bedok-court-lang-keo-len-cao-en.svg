<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5f5b53"/></marker>
  </defs>
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">The veranda as a buffer: from the kampong to the high-rise</text>

  <text x="24" y="62" font-size="12.5" font-weight="600" fill="#5f5b53">Kampong house, on the ground</text>
  <g stroke="#a8a498" stroke-width="1.25" fill="#ffffff">
    <rect x="24" y="72" width="210" height="70" rx="4"/>
    <rect x="275" y="72" width="210" height="70" rx="4" stroke="#b4472e" fill="#b4472e" fill-opacity="0.08"/>
    <rect x="526" y="72" width="210" height="70" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1c1b19">
    <text x="129" y="102" font-weight="600">Village lane, yard</text>
    <text x="380" y="102" font-weight="600">Veranda</text>
    <text x="631" y="102" font-weight="600">Room inside</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5f5b53">
    <text x="129" y="122">passers-by see each other</text>
    <text x="380" y="122">a buffer in between</text>
    <text x="631" y="122">more private</text>
  </g>
  <g stroke="#5f5b53" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="238" y1="107" x2="271" y2="107"/>
    <line x1="489" y1="107" x2="522" y2="107"/>
  </g>

  <text x="24" y="194" font-size="12.5" font-weight="600" fill="#5f5b53">Bedok Court, repeated on every floor</text>
  <g stroke="#a8a498" stroke-width="1.25" fill="#ffffff">
    <rect x="24" y="204" width="210" height="70" rx="4"/>
    <rect x="275" y="204" width="210" height="70" rx="4" stroke="#b4472e" fill="#b4472e" fill-opacity="0.08"/>
    <rect x="526" y="204" width="210" height="70" rx="4"/>
  </g>
  <g text-anchor="middle" fill="#1c1b19">
    <text x="129" y="234" font-weight="600">Shared corridor</text>
    <text x="380" y="234" font-weight="600">Forecourt</text>
    <text x="631" y="234" font-weight="600">Room in the flat</text>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#5f5b53">
    <text x="129" y="254">"street in the sky", 1.4 m</text>
    <text x="380" y="254">semi-open, best 2 m deep or more</text>
    <text x="631" y="254">more private</text>
  </g>
  <g stroke="#5f5b53" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="238" y1="239" x2="271" y2="239"/>
    <line x1="489" y1="239" x2="522" y2="239"/>
  </g>

  <g text-anchor="middle" font-size="11.5" fill="#b4472e">
    <path d="M275 288H485M275 283V293M485 283V293" stroke="#b4472e" stroke-width="1" fill="none"/>
    <text x="380" y="310">room to sit, enough shade, cooler with plants</text>
  </g>

  <g text-anchor="middle" font-size="12" fill="#5f5b53">
    <text x="129" y="352">shared</text>
    <text x="380" y="352">half shared, half private</text>
    <text x="631" y="352">private</text>
  </g>
  <line x1="24" y1="362" x2="736" y2="362" stroke="#a8a498" stroke-width="1.25" marker-end="url(#ar)"/>

  <g font-size="10.5" fill="#5f5b53">
    <text x="24" y="388">Conceptual diagram, not to scale. The two measurements (corridor 1.4 m, forecourt from 2 m) are from the Bedok Court survey</text>
    <text x="24" y="402">(Bay et al., 2006). This is the author's conceptual sketch, not a drawing of the building.</text>
  </g>
</svg>
