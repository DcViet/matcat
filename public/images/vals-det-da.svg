    <rect x="432" y="160" width="304" height="12"/>
    <rect x="432" y="172" width="304" height="8"/>
    <rect x="432" y="180" width="304" height="14"/>
    <rect x="432" y="194" width="304" height="6"/>
    <rect x="432" y="200" width="304" height="10"/>
