<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Mahaweli Building: what was intended and what the occupants did</text>

  <text x="24" y="64" font-size="11.5" font-weight="600" fill="#5f5b53" letter-spacing="0.6">INTENDED (BAWA)</text>
  <text x="416" y="64" font-size="11.5" font-weight="600" fill="#b4472e" letter-spacing="0.6">AFTER MOVING IN</text>

  <g stroke-width="1.25">
    <rect x="24" y="76" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="76" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="148" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="148" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="220" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="220" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="292" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="292" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
  </g>

  <g stroke="#5f5b53" stroke-width="1.5" fill="#5f5b53">
    <line x1="352" y1="104" x2="404" y2="104"/><polygon points="410,104 401,99 401,109" stroke="none"/>
    <line x1="352" y1="176" x2="404" y2="176"/><polygon points="410,176 401,171 401,181" stroke="none"/>
    <line x1="352" y1="248" x2="404" y2="248"/><polygon points="410,248 401,243 401,253" stroke="none"/>
    <line x1="352" y1="320" x2="404" y2="320"/><polygon points="410,320 401,315 401,325" stroke="none"/>
  </g>

  <g fill="#1c1b19">
    <text x="40" y="100">Open plan, wind passing through</text>
    <text x="40" y="118" fill="#5f5b53">the whole office floor</text>
    <text x="40" y="172">Vents at sill height, air enters</text>
    <text x="40" y="190" fill="#5f5b53">even with windows shut</text>
    <text x="40" y="244">Natural airflow cools the building</text>
    <text x="40" y="262" fill="#5f5b53">in place of machines</text>
    <text x="40" y="316">Windows for daylight, deep eaves</text>
    <text x="40" y="334" fill="#5f5b53">cutting low sun</text>
  </g>

  <g fill="#1c1b19">
    <text x="432" y="100">Tall partitions into a maze,</text>
    <text x="432" y="118" fill="#5f5b53">blocking both light and wind</text>
    <text x="432" y="172">Boarded up with plywood (rain splash,</text>
    <text x="432" y="190" fill="#5f5b53">vapor leaks when the AC runs)</text>
    <text x="432" y="244">Windows shut against dust and noise,</text>
    <text x="432" y="262" fill="#5f5b53">window air conditioners installed</text>
    <text x="432" y="316">Thick curtains drawn closed</text>
  </g>

  <text x="24" y="372" font-size="11.5" fill="#5f5b53">Conceptual diagram by the writer, after the paper by Tan and Robson (2006); not a drawing of the building.</text>
</svg>
