<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Ba bài học trong chương "Eyes Which Do Not See", xếp theo thứ tự</text>

  <!-- Hộp 1 -->
  <rect x="24" y="56" width="216" height="104" rx="6" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="40" y="82" font-weight="600" fill="#b4472e">1. Đặt đúng bài toán</text>
  <text x="40" y="106" font-size="12" fill="#5f5b53">Bài học từ máy bay:</text>
  <text x="40" y="124" font-size="12" fill="#5f5b53">hỏi nhà để làm gì,</text>
  <text x="40" y="142" font-size="12" fill="#5f5b53">chưa vội hỏi trông ra sao</text>

  <!-- Mũi tên 1 -->
  <line x1="244" y1="108" x2="266" y2="108" stroke="#1c1b19" stroke-width="1.5"/>
  <polygon points="268,108 260,103 260,113" fill="#1c1b19"/>

  <!-- Hộp 2 -->
  <rect x="272" y="56" width="216" height="104" rx="6" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="288" y="82" font-weight="600" fill="#b4472e">2. Chọn lọc trên chuẩn</text>
  <text x="288" y="106" font-size="12" fill="#5f5b53">Từ ô tô và Parthenon:</text>
  <text x="288" y="124" font-size="12" fill="#5f5b53">thử nghiệm, cạnh tranh,</text>
  <text x="288" y="142" font-size="12" fill="#5f5b53">chọn dần trên một chuẩn</text>

  <!-- Mũi tên 2 -->
  <line x1="492" y1="108" x2="514" y2="108" stroke="#1c1b19" stroke-width="1.5"/>
  <polygon points="516,108 508,103 508,113" fill="#1c1b19"/>

  <!-- Hộp 3 -->
  <rect x="520" y="56" width="216" height="104" rx="6" fill="#ffffff" stroke="#a8a498" stroke-width="1.25"/>
  <text x="536" y="82" font-weight="600" fill="#b4472e">3. Xúc cảm đến sau</text>
  <text x="536" y="106" font-size="12" fill="#5f5b53">Lý trí được thỏa trước,</text>
  <text x="536" y="124" font-size="12" fill="#5f5b53">rồi tỷ lệ tốt mới</text>
  <text x="536" y="142" font-size="12" fill="#5f5b53">đem xúc cảm tới</text>

  <!-- Dải nhu cầu -->
  <rect x="24" y="190" width="712" height="84" rx="6" fill="#ffffff" stroke="#b4472e" stroke-width="1.25"/>
  <text x="40" y="216" font-weight="600" fill="#1c1b19">Bài toán ngôi nhà mà ông muốn đặt lại</text>
  <text x="40" y="238" font-size="12" fill="#5f5b53">chỗ trú nóng, lạnh, mưa; chỗ chứa ánh sáng và nắng; tắm; nước nóng lạnh;</text>
  <text x="40" y="256" font-size="12" fill="#5f5b53">bảo quản thức ăn; và một vẻ đẹp hiểu theo nghĩa tỷ lệ tốt.</text>

  <text x="24" y="312" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, tóm ý một chương sách; không phải bản vẽ của công trình nào.</text>
</svg>
