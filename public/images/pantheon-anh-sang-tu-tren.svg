  <!-- Chú thích -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="591.2" y="304.8">cao 43,3 m</text>
    <text x="591.2" y="319.8">từ sàn đến ô tròn</text>

    <text x="562.4" y="498">tường trụ dày 6,4 m</text>
    <text x="330" y="528" text-anchor="middle">căn phòng rộng 43,3 m</text>

    <text x="374.8" y="113">ô tròn rộng khoảng 8 đến 9 m</text>
    <text x="374.8" y="127" dx="0">(vẽ 8,7 m)</text>

    <text x="236.8" y="87.6" text-anchor="end">nắng giữa trưa mùa hè</text>
    <text x="236.8" y="101.6" text-anchor="end">(góc khoảng 70°, ví dụ)</text>

    <text x="591.2" y="228.8">vòm dày 6,4 m ở chân,</text>
    <text x="591.2" y="242.8">mỏng dần còn khoảng 1,2 m</text>
    <text x="591.2" y="256.8">quanh ô tròn</text>

    <path d="M510.6,202.6 L586.4 239.8" stroke="#a8a498" stroke-width="1" fill="none"/>
    <text x="186" y="445.6" text-anchor="middle" font-size="10.5">người cao</text>
    <text x="186" y="457.6" text-anchor="middle" font-size="10.5">1,7 m</text>
    <text x="64" y="444" text-anchor="middle">10 m</text>
  </g>

  <g font-size="11.5" fill="#5f5b53">
    <line x1="24" y1="552" x2="54" y2="552" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 5"/>
    <text x="64" y="556">hình cầu: kéo dài vòm xuống thì vừa chạm sàn</text>
    <line x1="530" y1="552" x2="560" y2="552" stroke="#b4472e" stroke-width="3" opacity="0.8"/>
    <text x="570" y="556">mảng nắng trên sàn</text>
    <text x="24" y="578" font-size="10.5">Mặt cắt giản lược, vẽ theo tỉ lệ (1 m = 8 px) từ các số đo ở phần "Cái vòm"; thanh 10 m ở góc trái.</text>
    <text x="24" y="592" font-size="10.5">Bỏ hiên cột, cửa, các hốc tường và các ô lõm trên vòm. Độ dày vòm vẽ giảm đều cho dễ nhìn.</text>
    <text x="24" y="606" font-size="10.5">Hướng và góc nắng chỉ là ví dụ minh họa. Đây là hình của tác giả bài viết, không phải bản vẽ của công trình.</text>
  </g>
</svg>
