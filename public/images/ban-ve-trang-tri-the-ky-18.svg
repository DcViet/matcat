<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Bốn chặng của một bản vẽ thế kỷ 18</text>

  <!-- Chặng 1 -->
  <rect x="24" y="60" width="160" height="150" rx="6" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="104" y="90" text-anchor="middle" font-weight="600" fill="#1c1b19">1. Phác ý tưởng</text>
  <text x="104" y="118" text-anchor="middle" font-size="11.5" fill="#5f5b53">Bố cục, phác đầu tiên</text>
  <text x="104" y="134" text-anchor="middle" font-size="11.5" fill="#5f5b53">thử nhiều phương án</text>
  <text x="104" y="160" text-anchor="middle" font-size="11.5" fill="#5f5b53">Ví dụ: phối cảnh</text>
  <text x="104" y="176" text-anchor="middle" font-size="11.5" fill="#5f5b53">sân khấu, kiến trúc tạm</text>

  <!-- Mũi tên 1 -->
  <line x1="188" y1="135" x2="208" y2="135" stroke="#b4472e" stroke-width="2"/>
  <polygon points="208,130 216,135 208,140" fill="#b4472e"/>

  <!-- Chặng 2 -->
  <rect x="216" y="60" width="160" height="150" rx="6" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="296" y="90" text-anchor="middle" font-weight="600" fill="#1c1b19">2. Bản trình bày</text>
  <text x="296" y="118" text-anchor="middle" font-size="11.5" fill="#5f5b53">Vẽ đẹp, đủ nội thất</text>
  <text x="296" y="134" text-anchor="middle" font-size="11.5" fill="#5f5b53">để khách duyệt hoặc chọn</text>
  <text x="296" y="160" text-anchor="middle" font-size="11.5" fill="#5f5b53">Ví dụ: nội thất</text>
  <text x="296" y="176" text-anchor="middle" font-size="11.5" fill="#5f5b53">dinh thự tư ở Pháp</text>

  <!-- Mũi tên 2 -->
  <line x1="380" y1="135" x2="400" y2="135" stroke="#b4472e" stroke-width="2"/>
  <polygon points="400,130 408,135 400,140" fill="#b4472e"/>

  <!-- Chặng 3 -->
  <rect x="408" y="60" width="160" height="150" rx="6" fill="none" stroke="#b4472e" stroke-width="1.75"/>
  <text x="488" y="90" text-anchor="middle" font-weight="600" fill="#1c1b19">3. Bản thi công</text>
  <text x="488" y="118" text-anchor="middle" font-size="11.5" fill="#5f5b53">Số đo, chi tiết, chữ</text>
  <text x="488" y="134" text-anchor="middle" font-size="11.5" fill="#5f5b53">viết tay để thợ làm theo</text>
  <text x="488" y="160" text-anchor="middle" font-size="11.5" fill="#5f5b53">Ví dụ: bàn thờ Pantheon</text>
  <text x="488" y="176" text-anchor="middle" font-size="11.5" fill="#5f5b53">đo bằng braccia</text>

  <!-- Mũi tên 3 -->
  <line x1="572" y1="135" x2="592" y2="135" stroke="#b4472e" stroke-width="2"/>
  <polygon points="592,130 600,135 592,140" fill="#b4472e"/>

  <!-- Chặng 4 -->
  <rect x="600" y="60" width="136" height="150" rx="6" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="668" y="90" text-anchor="middle" font-weight="600" fill="#1c1b19">4. Bản in</text>
  <text x="668" y="118" text-anchor="middle" font-size="11.5" fill="#5f5b53">Khắc in để mẫu</text>
  <text x="668" y="134" text-anchor="middle" font-size="11.5" fill="#5f5b53">đi xa qua sách</text>
  <text x="668" y="160" text-anchor="middle" font-size="11.5" fill="#5f5b53">Ví dụ: sách của</text>
  <text x="668" y="176" text-anchor="middle" font-size="11.5" fill="#5f5b53">Blondel</text>

  <text x="24" y="250" font-size="11.5" fill="#5f5b53">Sơ đồ khái niệm, không theo tỉ lệ. Thứ tự các chặng là cách mình sắp xếp để dễ nhìn.</text>
  <text x="24" y="268" font-size="11.5" fill="#5f5b53">Các chặng này không cố định: một bản vẽ có thể đi qua một vài chặng, không nhất thiết đủ bốn.</text>
</svg>
