<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">From hanging chain to arch: three steps in Gaudí's model method</text>

  <g font-size="12.5" font-weight="600" fill="#1c1b19" text-anchor="middle">
    <text x="150" y="84">1. Hanging chain, weights</text>
    <text x="400" y="84">2. Photo, flipped</text>
    <text x="650" y="84">3. Volume drawn on top</text>
  </g>

  <!-- 1. Dây treo -->
  <g transform="translate(10,0)">
    <line x1="30" y1="126" x2="250" y2="126" stroke="#1c1b19" stroke-width="6"/>
    <path d="M50 130 Q140 370 230 130" fill="none" stroke="#b4472e" stroke-width="3" stroke-linecap="round"/>
    <line x1="86" y1="207" x2="86" y2="221" stroke="#a8a498" stroke-width="1.25"/><circle cx="86" cy="226" r="5" fill="#5f5b53"/><line x1="113" y1="239" x2="113" y2="253" stroke="#a8a498" stroke-width="1.25"/><circle cx="113" cy="258" r="5" fill="#5f5b53"/><line x1="140" y1="250" x2="140" y2="264" stroke="#a8a498" stroke-width="1.25"/><circle cx="140" cy="269" r="5" fill="#5f5b53"/><line x1="167" y1="239" x2="167" y2="253" stroke="#a8a498" stroke-width="1.25"/><circle cx="167" cy="258" r="5" fill="#5f5b53"/><line x1="194" y1="207" x2="194" y2="221" stroke="#a8a498" stroke-width="1.25"/><circle cx="194" cy="226" r="5" fill="#5f5b53"/>
  </g>

  <!-- 2. Ảnh lật ngược -->
  <g transform="translate(260,0)">
    <line x1="30" y1="334" x2="250" y2="334" stroke="#1c1b19" stroke-width="6"/>
    <path d="M50 330 Q140 90 230 330" fill="none" stroke="#b4472e" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 3. Vẽ thể tích lên ảnh -->
  <g transform="translate(510,0)">
    <line x1="30" y1="334" x2="250" y2="334" stroke="#1c1b19" stroke-width="6"/>
    <path d="M50 330 Q140 90 230 330" fill="none" stroke="#a8a498" stroke-width="26" stroke-linecap="butt"/>
    <path d="M50 330 Q140 90 230 330" fill="none" stroke="#b4472e" stroke-width="3" stroke-linecap="round"/>
    <rect x="36" y="296" width="28" height="34" fill="#a8a498"/>
    <rect x="216" y="296" width="28" height="34" fill="#a8a498"/>
  </g>

  <!-- Mũi tên -->
  <g stroke="#5f5b53" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 222H300M292 215L300 222L292 229"/>
    <path d="M500 222H550M542 215L550 222L542 229"/>
  </g>
  <g font-size="11.5" fill="#5f5b53" text-anchor="middle">
    <text x="275" y="246">photograph,</text><text x="275" y="261">then flip</text>
    <text x="525" y="246">draw over</text><text x="525" y="261">the photo</text>
  </g>

  <g font-size="11.5" fill="#5f5b53" text-anchor="middle">
    <text x="150" y="376">the chain only pulls,</text><text x="150" y="391">small weights bend it</text>
    <text x="400" y="376">the same curve becomes</text><text x="400" y="391">an arch in compression</text>
    <text x="650" y="376">soft pencil and chalk add</text><text x="650" y="391">volume to arches, columns</text>
  </g>

  <text x="24" y="416" font-size="11" fill="#5f5b53">Conceptual diagram by the writer, not Gaudí's drawing or a plan of the building; curve and scale are illustrative.</text>
</svg>
