<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Vườn khô đi từ đá thiêng đến sân sỏi: bốn giai đoạn</text>

  <!-- Mũi tên nối các giai đoạn -->
  <g stroke="#a8a498" stroke-width="1.25" fill="none">
    <path d="M186 125H206M370 125H390M554 125H574"/>
    <path d="M201 120l5 5-5 5M385 120l5 5-5 5M569 120l5 5-5 5"/>
  </g>

  <!-- Bốn ô -->
  <rect x="24" y="70" width="160" height="110" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="208" y="70" width="160" height="110" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="392" y="70" width="160" height="110" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="576" y="70" width="160" height="110" rx="8" fill="#b4472e" fill-opacity="0.12" stroke="#b4472e" stroke-width="2"/>

  <g text-anchor="middle" font-weight="600" fill="#1c1b19">
    <text x="104" y="98">1. Tiền sử</text>
    <text x="288" y="98">2. Nara – Heian</text>
    <text x="472" y="98">3. Kamakura</text>
    <text x="656" y="98">4. Cuối Kamakura</text>
  </g>
  <text x="656" y="114" text-anchor="middle" font-weight="600" fill="#1c1b19">đến Higashiyama</text>

  <g text-anchor="middle" font-size="11.5" fill="#5f5b53">
    <text x="104" y="144">Đá thiêng</text>
    <text x="288" y="144">Vài cụm đá khô nằm</text>
    <text x="288" y="160">trong vườn ao</text>
    <text x="472" y="144">Vườn khô ngang hàng</text>
    <text x="472" y="160">với vườn ao</text>
    <text x="656" y="144">Vườn chỉ còn khô</text>
  </g>

  <!-- Hai ví dụ nêu trong ghi chú -->
  <g stroke="#a8a498" stroke-width="1">
    <line x1="472" y1="180" x2="472" y2="204"/>
    <line x1="656" y1="180" x2="656" y2="204"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1c1b19">
    <text x="472" y="222">Saiho-ji: thác khô ba bậc</text>
    <text x="656" y="222">Ryōan-ji: không nước, không cây</text>
  </g>

  <text x="24" y="270" font-size="11.5" fill="#5f5b53">Bốn giai đoạn do Shigemori chia, theo Nitschke. Sơ đồ ý niệm của tác giả bài viết, không vẽ đúng tỉ lệ thời gian.</text>
</svg>
