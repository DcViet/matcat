<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Bốn chặng đi từ mặt đường xuống nước</text>
  <rect x="24" y="70" width="150" height="86" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="34" y="96" font-size="13" font-weight="600" fill="#1c1b19">1. Mặt đường</text>
  <text x="34" y="118" font-size="11.5" fill="#5f5b53">tường thấp,</text>
  <text x="34" y="135" font-size="11.5" fill="#5f5b53">gần như không</text>
  <text x="34" y="152" font-size="11.5" fill="#5f5b53">có gì để thấy</text>
  <path d="M174 113 L192 153" stroke="#a8a498" stroke-width="1.5" fill="none"/>
  <rect x="194" y="110" width="150" height="86" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="204" y="136" font-size="13" font-weight="600" fill="#1c1b19">2. Dốc xuống</text>
  <text x="204" y="158" font-size="11.5" fill="#5f5b53">bê tông thô,</text>
  <text x="204" y="175" font-size="11.5" fill="#5f5b53">mái hẫng, phố</text>
  <text x="204" y="192" font-size="11.5" fill="#5f5b53">khuất dần</text>
  <path d="M344 153 L362 193" stroke="#a8a498" stroke-width="1.5" fill="none"/>
  <rect x="364" y="150" width="150" height="86" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="374" y="176" font-size="13" font-weight="600" fill="#1c1b19">3. Lối có mái</text>
  <text x="374" y="198" font-size="11.5" fill="#5f5b53">gỗ, bóng râm,</text>
  <text x="374" y="215" font-size="11.5" fill="#5f5b53">tiếng sóng</text>
  <path d="M514 193 L532 233" stroke="#a8a498" stroke-width="1.5" fill="none"/>
  <rect x="534" y="190" width="150" height="86" fill="#ffffff" stroke="#1c1b19" stroke-width="1.5"/>
  <text x="544" y="216" font-size="13" font-weight="600" fill="#b4472e">4. Hồ bơi</text>
  <text x="544" y="238" font-size="11.5" fill="#5f5b53">mặt nước giữa</text>
  <text x="544" y="255" font-size="11.5" fill="#5f5b53">đá, rồi ra biển</text>
  <path d="M694 250 L736 250 L736 292 L694 292 Z" fill="none" stroke="#a8a498" stroke-width="1.5"/>
  <text x="715" y="316" text-anchor="middle" font-size="11.5" fill="#5f5b53">biển</text>
  <path d="M684 233 L694 262" stroke="#a8a498" stroke-width="1.5" fill="none"/>
  <text x="24" y="352" font-size="11.5" fill="#5f5b53">Sơ đồ khái niệm, không theo tỉ lệ; hình của người viết, không phải bản vẽ của công trình.</text>
</svg>