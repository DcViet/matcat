<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Concept section: a big roof, a thin house, wind passing through</text>

  <!-- Ground and floor -->
  <line x1="24" y1="330" x2="736" y2="330" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="215" y="322" width="330" height="8" fill="#1c1b19"/>

  <!-- Pitched roof with wide eaves -->
  <path d="M190 225 L380 110 L570 225" fill="none" stroke="#1c1b19" stroke-width="8" stroke-linejoin="miter"/>

  <!-- Two short wall pieces; open below for wind and people -->
  <rect x="296" y="160" width="8" height="72" fill="#1c1b19"/>
  <rect x="456" y="160" width="8" height="72" fill="#1c1b19"/>

  <!-- Veranda posts -->
  <rect x="223" y="208" width="4" height="114" fill="#1c1b19"/>
  <rect x="533" y="208" width="4" height="114" fill="#1c1b19"/>

  <!-- Big tree kept, and garden -->
  <g fill="none" stroke="#5f5b53" stroke-width="1.4" stroke-linecap="round">
    <path d="M70 330V252M70 276l-16-18M70 268l15-16"/>
    <circle cx="70" cy="215" r="38"/>
    <path d="M640 330q6-22 18-22q12 0 16 22M676 330q5-16 14-16q10 0 13 16"/>
  </g>

  <!-- Wind through the house -->
  <line x1="150" y1="255" x2="652" y2="255" stroke="#b4472e" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M652 249L664 255L652 261Z" fill="#b4472e"/>

  <!-- Person, for scale -->
  <g fill="none" stroke="#1c1b19" stroke-width="1.4" stroke-linecap="round">
    <circle cx="345" cy="276" r="6"/>
    <path d="M345 282v22M345 304l-6 18M345 304l6 18M345 289l-8 10M345 289l8 10"/>
  </g>

  <!-- Labels -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="24" y="160">keep big trees, have a garden</text>

    <text x="446" y="100">pitched roof, wide eaves</text>
    <path d="M444 104L424 132" stroke="#a8a498" stroke-width="1"/>

    <text x="380" y="200" text-anchor="middle">high room</text>

    <text x="582" y="215">no gutters</text>
    <text x="585" y="276" fill="#b4472e">wind passes through</text>

    <path d="M300 336v6M460 336v6M300 339H460" stroke="#a8a498" stroke-width="1" fill="none"/>
    <text x="262" y="358" text-anchor="middle">veranda: in-between</text>
    <text x="498" y="358" text-anchor="middle">veranda: in-between</text>
    <text x="380" y="378" text-anchor="middle" fill="#1c1b19">house one room deep, open on two sides</text>
  </g>

  <text x="24" y="404" font-size="11.5" fill="#5f5b53">Concept diagram by the writer, drawn from the criteria Powell recorded from Bawa.</text>
  <text x="24" y="420" font-size="11.5" fill="#5f5b53">Not to scale, and not a drawing of any actual building.</text>
</svg>
