<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Danh từ chỉ ra một lời giải, động từ mở ra bốn kiểu lời giải</text>

  <rect x="24" y="60" width="160" height="40" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="104" y="84" text-anchor="middle" font-weight="600" fill="#1c1b19">Cần cái thang</text>
  <line x1="184" y1="80" x2="208" y2="80" stroke="#a8a498" stroke-width="1.25"/>
  <text x="216" y="84" font-size="11.5" fill="#5f5b53">thang gỗ, thang nhôm, thang gấp: vẫn là cái thang</text>

  <g fill="none" stroke="#a8a498" stroke-width="1.25">
    <path d="M272 262C248 262 248 176 224 176"/>
    <path d="M272 278C248 278 248 372 224 372"/>
    <path d="M488 262C512 262 512 176 536 176"/>
    <path d="M488 278C512 278 512 372 536 372"/>
  </g>

  <rect x="272" y="242" width="216" height="56" rx="8" fill="#b4472e" fill-opacity="0.12" stroke="#b4472e" stroke-width="2"/>
  <text x="380" y="264" text-anchor="middle" fill="#1c1b19">Em bé cần</text>
  <text x="380" y="285" text-anchor="middle" font-size="15" font-weight="600" fill="#1c1b19">VỚI TỚI quyển sách</text>

  <rect x="24" y="148" width="200" height="56" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="124" y="172" text-anchor="middle" font-weight="600" fill="#1c1b19">Đổi dụng cụ</text>
  <text x="124" y="188" text-anchor="middle" font-size="11.5" fill="#5f5b53">cánh tay nối dài</text>

  <rect x="24" y="344" width="200" height="56" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="124" y="368" text-anchor="middle" font-weight="600" fill="#1c1b19">Đổi chính người dùng</text>
  <text x="124" y="384" text-anchor="middle" font-size="11.5" fill="#5f5b53">giày tăng chiều cao</text>

  <rect x="536" y="148" width="200" height="56" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="636" y="172" text-anchor="middle" font-weight="600" fill="#1c1b19">Nhờ người khác</text>
  <text x="636" y="188" text-anchor="middle" font-size="11.5" fill="#5f5b53">người lớn lấy giúp</text>

  <rect x="536" y="344" width="200" height="72" rx="8" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="636" y="368" text-anchor="middle" font-weight="600" fill="#1c1b19">Đổi môi trường</text>
  <text x="636" y="384" text-anchor="middle" font-size="11.5" fill="#5f5b53">hạ kệ, xếp sách ở tầng dưới</text>
  <text x="636" y="400" text-anchor="middle" font-size="11.5" fill="#5f5b53">(lớp chưa nhắc tới)</text>
</svg>
