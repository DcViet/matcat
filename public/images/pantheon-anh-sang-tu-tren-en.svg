<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="480" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">Conceptual section of the Pantheon: a sphere that just fits the room</text>

  <!-- Sphere completed from the dome -->
  <circle cx="380" cy="230" r="150" fill="none" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 5"/>
  <line x1="232" y1="230" x2="528" y2="230" stroke="#a8a498" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Slanting sun through the round opening -->
  <polygon points="366,80 394,80 499,380 471,380" fill="#b4472e" opacity="0.18"/>
  <g stroke="#b4472e" stroke-width="2" stroke-dasharray="6 4">
    <line x1="355" y1="48" x2="366" y2="80"/>
    <line x1="383" y1="48" x2="394" y2="80"/>
  </g>
  <g stroke="#b4472e" stroke-width="1.25" opacity="0.7">
    <line x1="366" y1="80" x2="471" y2="380"/>
    <line x1="394" y1="80" x2="499" y2="380"/>
  </g>

  <!-- Floor bouncing light into the corners -->
  <g stroke="#b4472e" stroke-width="1" opacity="0.4">
    <line x1="485" y1="378" x2="238" y2="250"/>
    <line x1="485" y1="378" x2="238" y2="345"/>
    <line x1="485" y1="378" x2="522" y2="290"/>
    <line x1="485" y1="378" x2="310" y2="128"/>
  </g>
  <rect x="471" y="376" width="28" height="4" fill="#b4472e"/>

  <!-- Floor, drum wall, dome in section -->
  <rect x="220" y="380" width="320" height="8" fill="#1c1b19"/>
  <rect x="220" y="230" width="12" height="150" fill="#1c1b19"/>
  <rect x="528" y="230" width="12" height="150" fill="#1c1b19"/>
  <path d="M226 230 A154 154 0 0 1 534 230" fill="none" stroke="#1c1b19" stroke-width="10"/>
  <rect x="366" y="66" width="28" height="22" fill="#ffffff"/>

  <!-- Door and portico -->
  <rect x="219" y="322" width="14" height="58" fill="#ffffff"/>
  <line x1="60" y1="384" x2="220" y2="384" stroke="#a8a498" stroke-width="1.5"/>
  <g stroke="#1c1b19" stroke-width="3">
    <line x1="150" y1="322" x2="150" y2="384"/>
    <line x1="175" y1="322" x2="175" y2="384"/>
    <line x1="200" y1="322" x2="200" y2="384"/>
  </g>
  <line x1="140" y1="320" x2="232" y2="320" stroke="#1c1b19" stroke-width="4"/>

  <!-- Measure marks on the right -->
  <g stroke="#5f5b53" stroke-width="1" fill="none">
    <path d="M556 80V380M551 80H561M551 230H561M551 380H561"/>
  </g>

  <!-- Labels -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="346" y="60" text-anchor="end">slanting sun</text>
    <text x="414" y="60">round opening at the top (oculus)</text>
    <path d="M412 62L397 76" stroke="#a8a498" stroke-width="1"/>

    <text x="404" y="186" text-anchor="end">cylinder</text>
    <text x="404" y="201" text-anchor="end">of sunlight</text>

    <text x="568" y="152">dome: half a sphere</text>
    <text x="568" y="300">drum wall as tall as</text>
    <text x="568" y="315">the dome's radius</text>

    <text x="212" y="308" text-anchor="end">portico, door</text>
    <text x="60" y="374">streets</text>

    <line x1="24" y1="412" x2="54" y2="412" stroke="#a8a498" stroke-width="1.25" stroke-dasharray="5 5"/>
    <text x="64" y="416">continue the dome downward and you get a full sphere that just touches the floor</text>
    <line x1="24" y1="432" x2="54" y2="432" stroke="#b4472e" stroke-width="1" opacity="0.6"/>
    <text x="64" y="436">the stone floor of squares and circles bounces light into the corners</text>
  </g>

  <text x="24" y="464" font-size="11.5" fill="#5f5b53">The writer's conceptual diagram, not to scale, not a drawing of the building; oculus and portico are illustrative.</text>
</svg>
