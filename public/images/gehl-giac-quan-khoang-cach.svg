<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Càng xa, ta càng ít thấy về nhau</text>

  <!-- Trục khoảng cách (thang logarit, 0,5 m đến 100 m) -->
  <line x1="60" y1="210" x2="700" y2="210" stroke="#a8a498" stroke-width="1.25"/>

  <!-- Đoạn nhấn trên trục -->
  <g stroke="#b4472e" stroke-width="5" stroke-linecap="round">
    <line x1="143.7" y1="210" x2="276.4" y2="210"/>
    <line x1="505.5" y1="210" x2="532.6" y2="210"/>
    <line x1="657" y1="210" x2="700" y2="210"/>
  </g>
  <g fill="#b4472e">
    <circle cx="378.7" cy="210" r="5"/>
    <circle cx="554.5" cy="210" r="5"/>
  </g>

  <!-- Vạch chia và số mét -->
  <g stroke="#a8a498" stroke-width="1.25">
    <line x1="143.7" y1="214" x2="143.7" y2="222"/>
    <line x1="276.4" y1="214" x2="276.4" y2="222"/>
    <line x1="378.7" y1="214" x2="378.7" y2="222"/>
    <line x1="505.5" y1="214" x2="505.5" y2="222"/>
    <line x1="554.5" y1="214" x2="554.5" y2="222"/>
    <line x1="657" y1="214" x2="657" y2="222"/>
    <line x1="700" y1="214" x2="700" y2="222"/>
  </g>
  <g font-size="11.5" fill="#5f5b53" text-anchor="middle">
    <text x="143.7" y="238">1 m</text>
    <text x="276.4" y="238">3 m</text>
    <text x="378.7" y="238">7 m</text>
    <text x="505.5" y="238">20 m</text>
    <text x="554.5" y="238">30 m</text>
    <text x="657" y="238">70 m</text>
    <text x="700" y="238">100 m</text>
  </g>
  <text x="380" y="272" text-anchor="middle" font-size="11.5" fill="#5f5b53">khoảng cách giữa hai người →</text>

  <!-- Dòng chú thích nối xuống trục -->
  <g stroke="#a8a498" stroke-width="1">
    <line x1="210" y1="162" x2="210" y2="205"/>
    <line x1="378.7" y1="132" x2="378.7" y2="205"/>
    <line x1="519" y1="176" x2="519" y2="205"/>
    <line x1="554.5" y1="102" x2="554.5" y2="205"/>
    <line x1="678" y1="86" x2="678" y2="205"/>
  </g>
  <g font-size="11.5" fill="#1c1b19">
    <text x="210" y="154" text-anchor="middle">1–3 m: trò chuyện thường</text>
    <text x="378.7" y="124" text-anchor="middle">7 m: nói chuyện còn dễ</text>
    <text x="519" y="154" text-anchor="middle">20–25 m: thấy tâm trạng,</text>
    <text x="519" y="169" text-anchor="middle" fill="#5f5b53" font-size="11">gặp gỡ bắt đầu thú vị</text>
    <text x="554.5" y="94" text-anchor="middle">30 m: thấy nét mặt</text>
    <text x="700" y="64" text-anchor="end">70–100 m: thấy giới, tuổi, dáng đi,</text>
    <text x="700" y="79" text-anchor="end" fill="#5f5b53" font-size="11">và việc người ta đang làm</text>
  </g>

  <text x="24" y="318" font-size="11.5" fill="#5f5b53">Thang logarit: các vạch cách đều theo tỉ lệ, không theo số mét. Số đo theo Gehl (bản Việt qua OCR, dựa trên Hall), cần đối chiếu.</text>
  <text x="24" y="336" font-size="11.5" fill="#5f5b53">Gehl gọi khoảng 100 m là "thị trường xã hội". Sơ đồ do tác giả bài viết vẽ lại từ các số đo trong sách.</text>
</svg>
