<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Phòng khách nhà Baker: mỗi chi tiết gánh nhiều việc</text>
  <rect x="24" y="56" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="84" fill="#1c1b19" font-weight="600" font-size="13">Cửa sổ lồi có ghế ngồi</text>
  <line x1="304" y1="79" x2="352" y2="79" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 73 L362 79 L352 85 Z" fill="#b4472e"/>
  <text x="376" y="75" fill="#5f5b53">đón sáng phía nam, có chỗ ngồi và chậu cây,</text>
  <text x="376" y="91" fill="#5f5b53">giấu bộ tản nhiệt lớn dưới ghế</text>
  <rect x="24" y="116" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="144" fill="#1c1b19" font-weight="600" font-size="13">Dải kính cao dưới mái</text>
  <line x1="304" y1="139" x2="352" y2="139" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 133 L362 139 L352 145 Z" fill="#b4472e"/>
  <text x="376" y="135" fill="#5f5b53">đưa ánh sáng vào sâu trong phòng</text>
  <text x="376" y="151" fill="#5f5b53">chạy quanh ba mặt</text>
  <rect x="24" y="176" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="204" fill="#1c1b19" font-weight="600" font-size="12">Ống nước nóng giấu sau ốp chân tường</text>
  <line x1="304" y1="199" x2="352" y2="199" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 193 L362 199 L352 205 Z" fill="#b4472e"/>
  <text x="376" y="195" fill="#5f5b53">sưởi nhiều ở nơi mất nhiệt nhiều,</text>
  <text x="376" y="211" fill="#5f5b53">tức là chỗ có kính</text>
  <rect x="24" y="236" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="264" fill="#1c1b19" font-weight="600" font-size="13">Hai cửa nhỏ ở đầu phòng, trên cao</text>
  <line x1="304" y1="259" x2="352" y2="259" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 253 L362 259 L352 265 Z" fill="#b4472e"/>
  <text x="376" y="255" fill="#5f5b53">mở từ gác nhỏ trên lò sưởi, thoát khí nóng</text>
  <text x="376" y="271" fill="#5f5b53">ở điểm cao nhất và cho gió chéo</text>
  <rect x="24" y="296" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="324" fill="#1c1b19" font-weight="600" font-size="13">Mái dốc nhẹ vươn ra phía nam</text>
  <line x1="304" y1="319" x2="352" y2="319" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 313 L362 319 L352 325 Z" fill="#b4472e"/>
  <text x="376" y="323" fill="#5f5b53">che nắng hè cho cửa sổ lồi</text>
  <text x="24" y="372" font-size="11.5" fill="#5f5b53">Sơ đồ khái niệm của người viết, không theo tỉ lệ và không phải bản vẽ của công trình.</text>
  <text x="24" y="388" font-size="11.5" fill="#5f5b53">Nội dung theo mô tả của Reyner Banham (1969) về phòng khách nhà Baker.</text>
</svg>
