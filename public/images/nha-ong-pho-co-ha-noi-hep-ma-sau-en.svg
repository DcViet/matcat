<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
<rect width="760" height="470" fill="#ffffff"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1c1b19">The tube house: solid and void linked from the street inward</text>
<text x="70" y="62" font-size="13" font-weight="600" fill="#1c1b19">Plan (seen from above)</text>
<line x1="70" y1="78" x2="710" y2="78" stroke="#a8a498" stroke-width="2"/><line x1="70" y1="152" x2="710" y2="152" stroke="#a8a498" stroke-width="2"/>
<rect x="70" y="84" width="140" height="62" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><text x="140" y="119" text-anchor="middle" font-size="12" fill="#1c1b19">shop</text>
<rect x="210" y="84" width="85" height="62" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/><text x="252.5" y="119" text-anchor="middle" font-size="12" fill="#b4472e">courtyard</text>
<rect x="295" y="84" width="170" height="62" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><text x="380" y="119" text-anchor="middle" font-size="12" fill="#1c1b19">middle house</text>
<rect x="465" y="84" width="85" height="62" fill="#ffffff" stroke="#b4472e" stroke-width="1.5" stroke-dasharray="6 4"/><text x="507.5" y="119" text-anchor="middle" font-size="12" fill="#b4472e">yard</text>
<rect x="550" y="84" width="160" height="62" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><text x="630" y="119" text-anchor="middle" font-size="12" fill="#1c1b19">kitchen, rear house</text>
<text x="70" y="172" font-size="11" fill="#5f5b53">street</text><text x="710" y="172" font-size="11" text-anchor="end" fill="#5f5b53">rear</text>
<text x="390" y="70" font-size="11" text-anchor="middle" fill="#5f5b53" display="none"></text>
<text x="390" y="172" font-size="11" text-anchor="middle" fill="#5f5b53">party wall, no openings</text>
<text x="70" y="214" font-size="13" font-weight="600" fill="#1c1b19">Long section (seen from the side)</text>
<rect x="70" y="300" width="140" height="100" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><polygon points="70,300 210,300 210,290 70,290" fill="#1c1b19" opacity="0.0"/><line x1="70" y1="350" x2="210" y2="350" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 3"/><g stroke="#b4472e" stroke-width="1.5" fill="none"><line x1="238.5" y1="236" x2="238.5" y2="386"/><line x1="266.5" y1="236" x2="266.5" y2="386"/></g><g fill="#b4472e"><polygon points="238.5,392 233.5,382 243.5,382"/><polygon points="266.5,392 261.5,382 271.5,382"/></g><rect x="234.5" y="258" width="36" height="16" fill="#ffffff"/><text x="252.5" y="270" text-anchor="middle" font-size="11" fill="#b4472e">daylight</text><rect x="295" y="300" width="170" height="100" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><polygon points="295,300 465,300 465,290 295,290" fill="#1c1b19" opacity="0.0"/><line x1="295" y1="350" x2="465" y2="350" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 3"/><g stroke="#b4472e" stroke-width="1.5" fill="none"><line x1="493.5" y1="236" x2="493.5" y2="386"/><line x1="521.5" y1="236" x2="521.5" y2="386"/></g><g fill="#b4472e"><polygon points="493.5,392 488.5,382 498.5,382"/><polygon points="521.5,392 516.5,382 526.5,382"/></g><rect x="489.5" y="258" width="36" height="16" fill="#ffffff"/><text x="507.5" y="270" text-anchor="middle" font-size="11" fill="#b4472e">daylight</text><rect x="550" y="300" width="160" height="100" fill="#f1efe9" stroke="#1c1b19" stroke-width="1.5"/><polygon points="550,300 710,300 710,290 550,290" fill="#1c1b19" opacity="0.0"/><line x1="550" y1="350" x2="710" y2="350" stroke="#a8a498" stroke-width="1" stroke-dasharray="4 3"/><line x1="50" y1="400" x2="730" y2="400" stroke="#1c1b19" stroke-width="2"/>
<text x="70" y="418" font-size="11" fill="#5f5b53">street</text><text x="710" y="418" font-size="11" text-anchor="end" fill="#5f5b53">rear</text>
<text x="390" y="418" font-size="11" text-anchor="middle" fill="#b4472e">warm air rises, fresh air comes in</text>
<text x="24" y="440" font-size="11.5" fill="#5f5b53">Conceptual diagram, not to scale. The order of parts follows the house at 87 Ma May; the widths are for illustration only.</text>
<text x="24" y="458" font-size="11.5" fill="#5f5b53">Not a drawing of the building.</text>
</svg>
