<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Chọn nấc nào là tùy việc: với tới hay lọt qua</text>

  <!-- Với tới: bách phân vị 5 -->
  <text x="60" y="78" font-weight="600" fill="#b4472e">Với tới: tính theo người nhỏ</text>
  <text x="60" y="96" font-size="11.5" fill="#5f5b53">quanh bách phân vị 5</text>
  <text x="60" y="112" font-size="11.5" fill="#5f5b53">kệ, nút bấm, tay nắm</text>
  <line x1="110" y1="122" x2="110" y2="210" stroke="#b4472e" stroke-width="1.5"/>

  <!-- Lọt qua: bách phân vị 95 -->
  <text x="700" y="78" text-anchor="end" font-weight="600" fill="#b4472e">Lọt qua: tính theo người to</text>
  <text x="700" y="96" text-anchor="end" font-size="11.5" fill="#5f5b53">quanh bách phân vị 95</text>
  <text x="700" y="112" text-anchor="end" font-size="11.5" fill="#5f5b53">hành lang, gầm bàn, chỗ trần thấp</text>
  <line x1="650" y1="122" x2="650" y2="210" stroke="#b4472e" stroke-width="1.5"/>

  <!-- 90% ở giữa -->
  <text x="380" y="158" text-anchor="middle" font-size="11.5" fill="#5f5b53">90% ở giữa: đồ chỉnh được (ghế xoay, kệ nâng hạ) nên phủ ít nhất khoảng này</text>
  <line x1="116" y1="170" x2="644" y2="170" stroke="#1c1b19" stroke-width="1.25"/>
  <path d="M124 165 L116 170 L124 175" fill="none" stroke="#1c1b19" stroke-width="1.25"/>
  <path d="M636 165 L644 170 L636 175" fill="none" stroke="#1c1b19" stroke-width="1.25"/>

  <!-- Trục số đo -->
  <line x1="80" y1="210" x2="680" y2="210" stroke="#a8a498" stroke-width="1.5"/>
  <circle cx="110" cy="210" r="5" fill="#b4472e"/>
  <circle cx="650" cy="210" r="5" fill="#b4472e"/>
  <circle cx="380" cy="210" r="5" fill="#ffffff" stroke="#5f5b53" stroke-width="1.5"/>
  <text x="110" y="232" text-anchor="middle" font-size="11.5" fill="#1c1b19">5</text>
  <text x="650" y="232" text-anchor="middle" font-size="11.5" fill="#1c1b19">95</text>
  <text x="394" y="232" font-size="11.5" fill="#1c1b19">50</text>
  <text x="80" y="252" font-size="11.5" fill="#5f5b53">số đo nhỏ</text>
  <text x="680" y="252" text-anchor="end" font-size="11.5" fill="#5f5b53">số đo lớn</text>

  <!-- Bách phân vị 50 -->
  <line x1="380" y1="216" x2="380" y2="266" stroke="#a8a498" stroke-width="1.25"/>
  <text x="380" y="284" text-anchor="middle" font-weight="600" fill="#1c1b19">Bách phân vị 50, con số ở giữa</text>
  <text x="380" y="302" text-anchor="middle" font-size="11.5" fill="#5f5b53">lấy làm kích thước chung thì một nửa nhóm chịu thiệt;</text>
  <text x="380" y="318" text-anchor="middle" font-size="11.5" fill="#5f5b53">chỉ hợp với chỗ lưng chừng, như chiều cao tựa tay</text>

  <text x="24" y="350" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, theo quy tắc chọn bách phân vị trong sách của Panero và Zelnik.</text>
  <text x="24" y="366" font-size="11.5" fill="#5f5b53">Không phải bản vẽ của công trình nào và không vẽ theo số liệu đo.</text>
</svg>
