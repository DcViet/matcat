<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Mặt cắt ý niệm một gian vòm: nắng đi vòng trước khi tới tranh</text>

  <!-- Sàn và hai tường bị cắt qua -->
  <rect x="110" y="320" width="540" height="8" fill="#1c1b19"/>
  <rect x="110" y="168" width="20" height="152" fill="#1c1b19"/>
  <rect x="630" y="168" width="20" height="152" fill="#1c1b19"/>

  <!-- Vỏ vòm bị cắt qua, chừa khe sáng ở đỉnh -->
  <path d="M120 168 Q380 42 640 168" fill="none" stroke="#1c1b19" stroke-width="10"/>
  <rect x="368" y="92" width="24" height="26" fill="#ffffff"/>

  <!-- Tấm phản xạ treo dưới khe -->
  <path d="M345 140 Q380 128 415 140" fill="none" stroke="#b4472e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M358 134V114M402 134V114" stroke="#a8a498" stroke-width="1.25"/>

  <!-- Nắng trực tiếp: dừng ở tấm phản xạ -->
  <line x1="356" y1="62" x2="384" y2="132" stroke="#b4472e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="348" y="70" text-anchor="end" font-size="11.5" fill="#5f5b53">nắng trực tiếp</text>

  <!-- Ánh sáng đã qua một lần phản xạ: hất lên mặt trong vòm -->
  <g stroke="#b4472e" stroke-width="1.25" opacity="0.6">
    <line x1="384" y1="130" x2="290" y2="117"/>
    <line x1="384" y1="130" x2="472" y2="118"/>
  </g>

  <!-- Ánh sáng bạc rải xuống từ mặt trong vòm -->
  <g stroke="#b4472e" stroke-width="1" opacity="0.35">
    <line x1="232" y1="133" x2="136" y2="228"/>
    <line x1="256" y1="127" x2="140" y2="260"/>
    <line x1="300" y1="118" x2="250" y2="316"/>
    <line x1="340" y1="114" x2="330" y2="316"/>
    <line x1="430" y1="114" x2="440" y2="316"/>
    <line x1="470" y1="118" x2="520" y2="316"/>
    <line x1="505" y1="123" x2="624" y2="262"/>
    <line x1="528" y1="130" x2="624" y2="228"/>
  </g>

  <!-- Tranh nhìn nghiêng trên tường -->
  <rect x="131" y="214" width="6" height="58" fill="#b4472e"/>
  <rect x="623" y="214" width="6" height="58" fill="#b4472e"/>

  <!-- Người xem, để thấy tỉ lệ -->
  <g fill="none" stroke="#1c1b19" stroke-width="1.4" stroke-linecap="round">
    <circle cx="380" cy="270" r="6"/>
    <path d="M380 276v24M380 300l-7 20M380 300l7 20M380 284l-9 11M380 284l9 11"/>
  </g>

  <!-- Chú thích -->
  <g font-size="11.5" fill="#5f5b53">
    <text x="410" y="74">khe sáng ở đỉnh vòm</text>
    <path d="M408 70L394 94" stroke="#a8a498" stroke-width="1"/>

    <text x="446" y="168">tấm phản xạ</text>
    <path d="M444 164L412 144" stroke="#a8a498" stroke-width="1"/>

    <text x="150" y="208">tranh</text>
    <text x="620" y="208" text-anchor="end">tranh</text>
    <text x="150" y="300">ánh sáng bạc,</text>
    <text x="150" y="315">dịu, không chói</text>
  </g>

  <text x="24" y="386" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của tác giả bài viết, không đúng tỉ lệ và không phải bản vẽ của công trình; hình vòm và tấm phản xạ đã rút gọn.</text>
</svg>
