<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">The Baker House living room: every detail does several jobs</text>
  <rect x="24" y="56" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="84" fill="#1c1b19" font-weight="600" font-size="13">Bay window with a seat</text>
  <line x1="304" y1="79" x2="352" y2="79" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 73 L362 79 L352 85 Z" fill="#b4472e"/>
  <text x="376" y="75" fill="#5f5b53">takes in southern light, gives a place to sit,</text>
  <text x="376" y="91" fill="#5f5b53">hides a large radiator under the seat</text>
  <rect x="24" y="116" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="144" fill="#1c1b19" font-weight="600" font-size="13">High band of glass under the roof</text>
  <line x1="304" y1="139" x2="352" y2="139" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 133 L362 139 L352 145 Z" fill="#b4472e"/>
  <text x="376" y="135" fill="#5f5b53">carries light deep into the room,</text>
  <text x="376" y="151" fill="#5f5b53">running around three sides</text>
  <rect x="24" y="176" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="204" fill="#1c1b19" font-weight="600" font-size="12">Hot-water pipes behind the baseboard</text>
  <line x1="304" y1="199" x2="352" y2="199" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 193 L362 199 L352 205 Z" fill="#b4472e"/>
  <text x="376" y="195" fill="#5f5b53">heat most where the most heat is lost,</text>
  <text x="376" y="211" fill="#5f5b53">that is, where the glass is</text>
  <rect x="24" y="236" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="264" fill="#1c1b19" font-weight="600" font-size="13">Two small high windows at one end</text>
  <line x1="304" y1="259" x2="352" y2="259" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 253 L362 259 L352 265 Z" fill="#b4472e"/>
  <text x="376" y="255" fill="#5f5b53">opened from a small gallery over the fireplace; they vent</text>
  <text x="376" y="271" fill="#5f5b53">hot air at the highest point and make a cross draft</text>
  <rect x="24" y="296" width="270" height="46" rx="4" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <text x="36" y="324" fill="#1c1b19" font-weight="600" font-size="13">Gently sloped roof reaching south</text>
  <line x1="304" y1="319" x2="352" y2="319" stroke="#b4472e" stroke-width="2"/>
  <path d="M352 313 L362 319 L352 325 Z" fill="#b4472e"/>
  <text x="376" y="323" fill="#5f5b53">shades the bay window in summer</text>
  <text x="24" y="372" font-size="11.5" fill="#5f5b53">Conceptual diagram by the author, not to scale and not a drawing of the building.</text>
  <text x="24" y="388" font-size="11.5" fill="#5f5b53">Content follows Reyner Banham’s (1969) description of the Baker House living room.</text>
</svg>
