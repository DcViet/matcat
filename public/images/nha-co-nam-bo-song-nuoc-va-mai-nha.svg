<text x="48" y="334" fill="#1c1b19">Sông rạch: đường đi và nguồn nước</text>
<circle cx="33" cy="352" r="9" fill="#b4472e"/><text x="33" y="356.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">2</text>
<text x="48" y="356" fill="#1c1b19">Nền nâng lên, rải muối dưới gạch</text>
<circle cx="33" cy="374" r="9" fill="#b4472e"/><text x="33" y="378.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">3</text>
<text x="48" y="378" fill="#1c1b19">Mái ngói lớn chìa ra thành hiên</text>
<circle cx="401" cy="330" r="9" fill="#b4472e"/><text x="401" y="334.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">4</text>
<text x="416" y="334" fill="#1c1b19">Nhiều cửa và cửa chớp cho gió qua</text>
<circle cx="401" cy="352" r="9" fill="#b4472e"/><text x="401" y="356.5" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">5</text>
<text x="416" y="356" fill="#1c1b19">Vườn và sân quanh nhà, cũng là phần của nhà</text>
<text x="392" y="378" font-size="11.5" fill="#5f5b53">thủy: nước, sân, vườn</text>
<text x="24" y="402" font-size="11.5" fill="#5f5b53">Sơ đồ khái niệm của người viết, không theo tỉ lệ, không phải bản vẽ của một ngôi nhà cụ thể.</text>
