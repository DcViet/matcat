<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="350" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Hai cách đặt cây: cho nó đứng một mình, hoặc gom thành khóm</text>

  <rect x="24" y="52" width="338" height="244" fill="none" stroke="#a8a498" stroke-width="1.25"/>
  <rect x="398" y="52" width="338" height="244" fill="none" stroke="#a8a498" stroke-width="1.25"/>

  <text x="40" y="76" font-weight="600" fill="#1c1b19">Một cây đứng riêng</text>
  <text x="414" y="76" font-weight="600" fill="#1c1b19">Một khóm cây</text>

  <!-- Mặt bằng: một cây -->
  <rect x="40" y="88" width="306" height="96" fill="#f4f2ec"/>
  <circle cx="193" cy="130" r="34" fill="#b4472e" fill-opacity="0.85"/>
  <circle cx="193" cy="130" r="3" fill="#1c1b19"/>
  <text x="193" y="181" text-anchor="middle" font-size="11" fill="#5f5b53">nhìn từ trên xuống</text>

  <!-- Mặt bằng: khóm cây -->
  <rect x="414" y="88" width="306" height="96" fill="#f4f2ec"/>
  <circle cx="540" cy="128" r="26" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="584" cy="122" r="32" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="548" cy="152" r="17" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="618" cy="140" r="21" fill="#5f5b53" fill-opacity="0.65"/>
  <circle cx="578" cy="153" r="12" fill="#5f5b53" fill-opacity="0.65"/>
  <text x="567" y="181" text-anchor="middle" font-size="11" fill="#5f5b53">nhiều tán, một khối</text>

  <text x="40" y="212" fill="#1c1b19">· đặt giữa chỗ trống, làm tâm cảnh</text>
  <text x="40" y="236" fill="#1c1b19">· nền tương phản: trời, tường, bóng cây</text>
  <text x="40" y="260" fill="#1c1b19">· dáng và màu phải có nét riêng</text>
  <text x="40" y="284" fill="#1c1b19">· ở gần lối đi: lá, hoa phải đẹp</text>
  <text x="414" y="212" fill="#1c1b19">· nối chỗ thoáng sang chỗ đặc</text>
  <text x="414" y="236" fill="#1c1b19">· chuyển hình khối cạnh công trình</text>
  <text x="414" y="260" fill="#1c1b19">· bên nước: cây rủ, màu khác hai bên</text>
  <text x="414" y="284" fill="#1c1b19">· cuối đường: khép tầm nhìn, làm nền</text>

  <text x="24" y="322" font-size="11.5" fill="#5f5b53">Sơ đồ khái niệm, không theo tỉ lệ. Ý theo giáo trình của Hàn Tất Ngạn (1999); hình là của người viết.</text>
</svg>
