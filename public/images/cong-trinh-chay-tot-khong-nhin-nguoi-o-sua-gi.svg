<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" font-family="'Segoe UI', Arial, sans-serif" font-size="13">
  <rect width="760" height="392" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1c1b19">Tòa Mahaweli: điều dự định và điều người ở làm</text>

  <text x="24" y="64" font-size="11.5" font-weight="600" fill="#5f5b53" letter-spacing="0.6">DỰ ĐỊNH (BAWA)</text>
  <text x="416" y="64" font-size="11.5" font-weight="600" fill="#b4472e" letter-spacing="0.6">SAU KHI DỌN VÀO</text>

  <!-- Bốn hàng -->
  <g stroke-width="1.25">
    <rect x="24" y="76" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="76" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="148" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="148" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="220" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="220" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
    <rect x="24" y="292" width="320" height="56" rx="8" fill="#ffffff" stroke="#a8a498"/>
    <rect x="416" y="292" width="320" height="56" rx="8" fill="#b4472e" fill-opacity="0.07" stroke="#b4472e"/>
  </g>

  <!-- Mũi tên -->
  <g stroke="#5f5b53" stroke-width="1.5" fill="#5f5b53">
    <line x1="352" y1="104" x2="404" y2="104"/><polygon points="410,104 401,99 401,109" stroke="none"/>
    <line x1="352" y1="176" x2="404" y2="176"/><polygon points="410,176 401,171 401,181" stroke="none"/>
    <line x1="352" y1="248" x2="404" y2="248"/><polygon points="410,248 401,243 401,253" stroke="none"/>
    <line x1="352" y1="320" x2="404" y2="320"/><polygon points="410,320 401,315 401,325" stroke="none"/>
  </g>

  <!-- Chữ bên trái -->
  <g fill="#1c1b19">
    <text x="40" y="100">Mặt bằng mở, gió đi xuyên qua</text>
    <text x="40" y="118" fill="#5f5b53">cả tầng văn phòng</text>
    <text x="40" y="172">Ô gió ở cao độ bệ cửa, đóng cửa</text>
    <text x="40" y="190" fill="#5f5b53">vẫn có gió vào</text>
    <text x="40" y="244">Gió tự nhiên làm mát cả tòa nhà</text>
    <text x="40" y="262" fill="#5f5b53">thay cho máy</text>
    <text x="40" y="316">Cửa sổ lấy sáng, mái đua sâu</text>
    <text x="40" y="334" fill="#5f5b53">che nắng thấp</text>
  </g>

  <!-- Chữ bên phải -->
  <g fill="#1c1b19">
    <text x="432" y="100">Chia vách cao thành mê cung,</text>
    <text x="432" y="118" fill="#5f5b53">chặn cả sáng lẫn gió</text>
    <text x="432" y="172">Bít bằng ván ép (mưa tạt, rò hơi</text>
    <text x="432" y="190" fill="#5f5b53">khi chạy điều hòa)</text>
    <text x="432" y="244">Đóng cửa vì bụi và ồn xe,</text>
    <text x="432" y="262" fill="#5f5b53">lắp điều hòa cửa sổ</text>
    <text x="432" y="316">Rèm vải dày kéo kín</text>
  </g>

  <text x="24" y="372" font-size="11.5" fill="#5f5b53">Sơ đồ ý niệm của người viết, theo bài của Tan và Robson (2006); không phải bản vẽ của công trình.</text>
</svg>
