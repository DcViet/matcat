<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5">
  <rect width="760" height="350" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1c1b19">One outer box, two ways to divide the inside</text>
  <text x="40" y="64" font-weight="600" fill="#1c1b19">Stacked floors: one height per floor</text>
  <text x="420" y="64" font-weight="600" fill="#1c1b19">Raumplan: one height per room</text>
  <rect x="40" y="80" width="300" height="67" fill="#faf8f3" stroke="#a8a498" stroke-width="1.25"/>
  <text x="52" y="117.5" fill="#5f5b53">floor 3: bedrooms</text>
  <rect x="40" y="147" width="300" height="66" fill="#f4f1ea" stroke="#a8a498" stroke-width="1.25"/>
  <text x="52" y="184" fill="#5f5b53">floor 2: living, dining</text>
  <rect x="40" y="213" width="300" height="67" fill="#faf8f3" stroke="#a8a498" stroke-width="1.25"/>
  <text x="52" y="250.5" fill="#5f5b53">floor 1: hall, kitchen</text>
  <rect x="40" y="80" width="300" height="200" fill="none" stroke="#1c1b19" stroke-width="2.5"/>
  <rect x="420" y="80" width="100" height="70" fill="#faf8f3" stroke="#a8a498" stroke-width="1.25"/>
  <text x="470" y="119" text-anchor="middle" fill="#5f5b53">bath</text>
  <rect x="420" y="150" width="100" height="80" fill="#f4f1ea" stroke="#a8a498" stroke-width="1.25"/>
  <text x="470" y="194" text-anchor="middle" fill="#5f5b53">dining</text>
  <rect x="420" y="230" width="100" height="50" fill="#faf8f3" stroke="#a8a498" stroke-width="1.25"/>
  <text x="470" y="259" text-anchor="middle" fill="#5f5b53">hall</text>
  <rect x="520" y="80" width="200" height="90" fill="#faf8f3" stroke="#a8a498" stroke-width="1.25"/>
  <text x="620" y="129" text-anchor="middle" fill="#5f5b53">bedroom</text>
  <rect x="520" y="170" width="200" height="110" fill="#f6e6e0" stroke="#a8a498" stroke-width="1.25"/>
  <text x="620" y="229" text-anchor="middle" fill="#b4472e" font-weight="600">living room (tall)</text>
  <rect x="420" y="80" width="300" height="200" fill="none" stroke="#1c1b19" stroke-width="2.5"/>
  <text x="24" y="312" font-size="11.5" fill="#5f5b53">From the street the two houses look almost alike: a plain box with small windows. The difference is inside.</text>
  <text x="24" y="330" font-size="11.5" fill="#5f5b53">Conceptual diagram by the author, not to scale, not a drawing of any real building.</text>
</svg>
